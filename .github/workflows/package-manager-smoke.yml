name: Package manager smoke

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'R04 release dry-run ID containing all platform artifacts'
        required: true
        type: string
      previous_run_id:
        description: 'Previous R04 run with older macOS artifacts (real brew upgrade)'
        required: true
        type: string
      previous_version:
        description: 'Exact CLI version in previous_run_id'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  brew:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      OPENSPIDER_SECRET_STORE: memory
      OPENSPIDER_DISABLE_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: openspider-macos-*
          merge-multiple: true
          path: incoming
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.previous_run_id }}
          pattern: openspider-macos-*
          merge-multiple: true
          path: previous
      - name: Install, real upgrade, uninstall with linked CLI
        env:
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node --input-type=module -e "import {readVersion} from './scripts/release/check-version.mjs'; console.log(readVersion(process.cwd()))")
          export PACKAGE_VERSION
          # Current structured Cask steps need Homebrew 7; update runner tooling first.
          brew update
          ruby packaging/homebrew/lifecycle.test.rb
          bash packaging/homebrew/smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-manager-${{ matrix.runner }}
          path: ~/Library/Logs/Homebrew/
          if-no-files-found: warn

  winget:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OPENSPIDER_SECRET_STORE: memory
      OPENSPIDER_DISABLE_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: openspider-windows-x86_64
          path: incoming
      - name: Validate and install both scopes via winget (unsigned permitted)
        shell: pwsh
        run: |
          $version = node --input-type=module -e "import {readVersion} from './scripts/release/check-version.mjs'; console.log(readVersion(process.cwd()))"
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
          ./packaging/winget/smoke.ps1 -Version $version -Repository $env:GITHUB_REPOSITORY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-manager-windows
          path: |
            generated/
            ~/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/DiagOutputDir/
          if-no-files-found: warn
