name: Publish package metadata

# D12: no push, dispatch, workflow_call or prerelease trigger may publish packages.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: M3-REL opt-in and stable release prerequisites (D14)
        id: gate
        env:
          ENABLED: ${{ vars.RELEASE_PACKAGES_ENABLED }}
          DRAFT: ${{ github.event.release.draft }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_ID: ${{ vars.OPENSPIDER_PACKAGE_ID }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          WINGET_FORK: ${{ vars.WINGET_FORK_REPOSITORY }}
        run: |
          set -euo pipefail
          if [[ "$DRAFT" == true || "$PRERELEASE" == true || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::notice::Paketveröffentlichung übersprungen: nur stabile veröffentlichte Releases.'
            exit 0
          fi
          if [[ "$ENABLED" != true || -z "$PACKAGE_ID" || -z "$TAP_REPOSITORY" || -z "$WINGET_FORK" ]]; then
            echo '::notice::Paketveröffentlichung deaktiviert: M3-REL/K3-08 oder Repository-Angaben fehlen. Keine externen Änderungen.'
            echo 'Paketveröffentlichung übersprungen; Freigabe erst mit M3-REL. Keine Tokenwerte protokolliert.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - name: Check environment secrets after release approval (D14)
        id: credentials
        env:
          TAP_READY: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
          WINGET_READY: ${{ secrets.WINGET_PR_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "$TAP_READY" != true || "$WINGET_READY" != true ]]; then
            echo '::notice::Paketveröffentlichung übersprungen: Environment-Secrets in release fehlen. Keine externen Änderungen.'
            echo 'Paketveröffentlichung übersprungen; Environment-Secrets fehlen. Keine Tokenwerte protokolliert.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download exact published assets and generate metadata
        if: steps.credentials.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          OPENSPIDER_PACKAGE_ID: ${{ vars.OPENSPIDER_PACKAGE_ID }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*.dmg' --pattern '*.msi' --pattern '*-setup.exe'
          node packaging/homebrew/generate.mjs --directory release-assets --output generated \
            --version "${RELEASE_TAG#v}" --repository "$GH_REPO"
      - name: Commit existing tap and open winget PR in existing fork
        if: steps.credentials.outputs.ready == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          OPENSPIDER_PACKAGE_ID: ${{ vars.OPENSPIDER_PACKAGE_ID }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          WINGET_FORK_REPOSITORY: ${{ vars.WINGET_FORK_REPOSITORY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_PR_TOKEN: ${{ secrets.WINGET_PR_TOKEN }}
        run: bash packaging/winget/publish.sh
