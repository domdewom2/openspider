name: Scale nightly
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scale-nightly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scale:
    runs-on: macos-15
    timeout-minutes: 180
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      OPENSPIDER_SECRET_STORE: memory
      OS_SCALE_DEST: nightly-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release tools
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(['cargo','build','--release','--locked','-p','os-cli','-p','os-testsite'], check=True, timeout=5400)
          PY
      - name: Measure 100k and 250k
        run: |
          python3 - <<'PY'
          import subprocess
          for n in (100000,250000):
              subprocess.run(['scripts/bench/wait_quiet.sh','2','60'], check=True, timeout=5400)
              subprocess.run(['caffeinate','-i','python3','-I','docs/plan/M2-acceptance/scale/run-stage.py',str(n)], check=True, timeout=5400)
          PY
      - name: Compare storage growth
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path('docs/plan/M2-acceptance/scale') / os.environ['OS_SCALE_DEST']
          stages = [json.loads((folder/f'stage-{n}.json').read_text()) for n in (100000,250000)]
          lines = ['# Scale nightly', '', '| URLs | Bytes/URL | unused % | first / last URLs/s | WAL peak bytes |', '|---:|---:|---:|---:|---:|']
          values = []
          for x in stages:
              s = x['storage']; value = s['file_bytes']/x['n']; values.append(value)
              unused = sum(o['unused'] for o in s['objects'])/s['file_bytes']*100
              wal = max([p['wal_bytes'] for p in x['samples']] + [p.get('wal_after',0) for p in x['phases']] + [x['diag']['store']['wal_bytes_max']])
              lines.append(f"| {x['n']} | {value:.1f} | {unused:.2f} | {x['windows'][0]['urls_per_s']:.1f} / {x['windows'][-1]['urls_per_s']:.1f} | {wal} |")
          ratio = values[1]/values[0]
          lines += ['', f'Bytes/URL ratio 250k/100k: {ratio:.4f} (limit 1.3).']
          report = '\n'.join(lines)+'\n'
          (folder/'comparison.md').write_text(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary: summary.write(report)
          assert ratio <= 1.3, 'storage growth regression'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-${{ github.run_id }}
          path: docs/plan/M2-acceptance/scale/nightly-*/
          retention-days: 14
      - name: Remove build files
        if: always()
        run: rm -rf target/
