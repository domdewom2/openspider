# macOS-Pipeline M3-R01 (auf M2-Z01): native Tests, drei DMGs, Updater-Signaturen.
#
# Baut die Desktop-App, signiert sie mit Developer ID (Hardened Runtime), notarisiert sie, heftet das Ticket und erzeugt
# ein signiertes, notarisiertes DMG. Ergebnis ist ausschließlich ein Actions-Artefakt (14 Tage); es wird nichts
# veröffentlicht (kein GitHub Release, kein Upload nach außen). Anleitung: docs/release/macos-signing.md.
#
# Secrets:   APPLE_CERTIFICATE (base64 der .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD
#            (App-spezifisches Passwort), KEYCHAIN_PASSWORD (frei gewählt, nur für den temporären Schlüsselbund)
# Variablen: APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"), APPLE_TEAM_ID
# Fehlt eines davon, endet der Signierjob grün mit Hinweis; unabhängige Plattformtests laufen weiterhin.

name: Release macOS

on:
  workflow_call:
    inputs:
      version:
        description: "Release-Version ohne v (leer = Workspace-Version)"
        type: string
        default: ""
      run_tests:
        description: "Native Tests vor dem Build ausführen"
        type: boolean
        default: true
      channel:
        type: string
        default: stable
    outputs:
      artifact_names:
        description: "JSON-Liste der Artefaktnamen; leer bei fehlenden Apple-Zugangsdaten"
        value: ${{ jobs.artifacts.outputs.names }}
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Release-Version ohne v (leer = Workspace-Version)"
        type: string
        default: ""
      run_tests:
        description: "Native Tests vor dem Build ausführen"
        type: boolean
        default: true
      channel:
        description: "Update-Kanal"
        type: choice
        options: [stable, beta]
        default: beta
      arch:
        description: "Architektur (all = drei DMGs)"
        type: choice
        options: [all, universal, aarch64, x86_64]
        default: all

permissions:
  contents: read
  actions: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # OUT-260: native Release-Tests auf arm64 und Intel; Push-Tests liegen in ci.yml.
  tests:
    if: inputs.run_tests
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Intel (OUT-261, nur Warnung): Ein Zeitlimit des Jobs bricht ihn ab und überspringt Bau und Smoke, continue-on-error hilft
    # dann nicht (Trockenlauf beta.3 42290151510). Deshalb Zeitlimits je Schritt, die Summe bleibt unter dem des Jobs.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      OPENSPIDER_SECRET_STORE: memory
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Wie ci.yml: Beim Linken der Testprogramme lief der macOS-Runner voll ("ld: write() failed, errno=28",
      # Trockenlauf beta.3 42189071580). Nicht gewählte Xcode-Versionen im Hintergrund löschen.
      - name: "Speicherplatz schaffen (ungenutzte Xcode-Versionen)"
        run: |
          df -h / | tail -n 1
          selected="$(xcode-select -p | sed 's|/Contents/Developer$||')"
          echo "Gewähltes Xcode: $selected"
          case "$selected" in
            /Applications/Xcode*.app) ;;
            *) echo "Kein Xcode.app gewählt, nichts gelöscht"; exit 0 ;;
          esac
          selected_real="$(realpath "$selected")"
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            [ "$(realpath "$app")" = "$selected_real" ] && continue
            echo "Entferne $app"
            sudo nohup rm -rf "$app" > /dev/null 2>&1 &
          done
          sudo nohup rm -rf "$HOME/Library/Android" > /dev/null 2>&1 &
          sleep 1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - name: Testumgebung
        run: |
          echo "OPENSPIDER_CHROMIUM=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
          mkdir -p apps/desktop/src-tauri/binaries
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          cargo build -p os-cli --bin openspider -j 4 --locked
          cp target/debug/openspider "apps/desktop/src-tauri/binaries/openspider-$triple"
      - id: fmt
        # OUT-261 (Nutzer 03.11.2026): auf Intel nur Warnung.
        continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
        run: cargo fmt --all --check
      - id: clippy
        continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
        timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 40 || 120 }}
        run: cargo clippy --workspace --all-targets -j 4 --locked -- -D warnings
      - id: test
        continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
        timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 75 || 120 }}
        run: cargo test --workspace -j 4 --locked
      - id: app
        continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
        timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 15 || 120 }}
        run: npm run -w apps/desktop typecheck && npm run -w apps/desktop test && npm run -w apps/desktop check:static
      - id: release_py
        continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
        run: python3 -m unittest discover -s tests/release -p 'test_macos_*.py' -v
      - id: neutral
        continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
        run: bash scripts/check-neutral.sh
      - name: Hinweis Intel-Tests (nur Warnung, OUT-261)
        if: matrix.os == 'macos-15-intel' && (steps.fmt.outcome == 'failure' || steps.clippy.outcome == 'failure' || steps.test.outcome == 'failure' || steps.app.outcome == 'failure' || steps.release_py.outcome == 'failure' || steps.neutral.outcome == 'failure')
        run: echo "::warning title=Intel-Tests::Tests auf macos-15-intel fehlgeschlagen (fmt=${{ steps.fmt.outcome }}, clippy=${{ steps.clippy.outcome }}, test=${{ steps.test.outcome }}, app=${{ steps.app.outcome }}, release_py=${{ steps.release_py.outcome }}, neutral=${{ steps.neutral.outcome }}); nach OUT-261 nur Warnung, Bau, Signatur und Smoke bleiben blockierend."

  macos:
    # Explicit status check allows a deliberately skipped test job, but blocks failed tests.
    if: ${{ !cancelled() && (needs.tests.result == 'success' || (!inputs.run_tests && needs.tests.result == 'skipped')) }}
    needs: tests
    name: signiertes DMG (${{ matrix.arch }})
    environment: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, arch: aarch64}
          - {os: macos-15-intel, arch: x86_64}
          - {os: macos-15, arch: universal}
    env:
      ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      OPENSPIDER_SECRET_STORE: memory
      OPENSPIDER_DISABLE_UPDATE_CHECK: "1"
      RELEASE_VERSION: ${{ inputs.version }}
      OPENSPIDER_UPDATER_PUBKEY: ${{ vars.OPENSPIDER_UPDATER_PUBKEY }}
      OPENSPIDER_UPDATE_BETA: ${{ inputs.channel == 'beta' && '1' || '0' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Secrets und Variablen prüfen
        id: check
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ "${{ inputs.arch || 'all' }}" != all && "${{ inputs.arch || 'all' }}" != "$ARCH" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD KEYCHAIN_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            list="${missing[*]}"
            echo "::warning title=macOS-Signierung übersprungen::Nicht gesetzt: ${list}. Secrets und Variablen anlegen, siehe docs/release/macos-signing.md."
            {
              echo "### macOS-Signierung übersprungen"
              echo
              echo "Es fehlen: \`${list}\`"
              echo
              echo "Secrets: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, KEYCHAIN_PASSWORD."
              echo "Variablen: APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID."
              echo "Anleitung: \`docs/release/macos-signing.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "macOS-Signierung übersprungen, nicht gesetzt: ${list}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Alle Secrets und Variablen sind gesetzt."
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Ziel bestimmen
        if: steps.check.outputs.ready == 'true'
        run: |
          case "$ARCH" in
            universal) target=universal-apple-darwin ;;
            aarch64) target=aarch64-apple-darwin ;;
            x86_64) target=x86_64-apple-darwin ;;
            *) echo "Unbekannte Architektur: $ARCH" >&2; exit 1 ;;
          esac
          echo "TAURI_TARGET=$target" >> "$GITHUB_ENV"
          echo "BUNDLE_DIR=target/$target/release/bundle" >> "$GITHUB_ENV"
          echo "Build-Ziel: $target"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.check.outputs.ready == 'true'
      - name: Build-Kennung (Hilfe → Über, Debug-Info, Absturzberichte)
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: echo "OPENSPIDER_BUILD=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      # Ohne rust-cache: ein signierter Release-Build soll nicht von einem Cache abhängen.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.check.outputs.ready == 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.check.outputs.ready == 'true'
        timeout-minutes: 10
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Cache build-only license tool (MIT OR Apache-2.0)
        if: steps.check.outputs.ready == 'true'
        id: cargo-about-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cargo-about/bin
          key: cargo-about-0.9.3-cli-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install build-only license tool on cache miss
        if: steps.check.outputs.ready == 'true' && steps.cargo-about-cache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: nice -n 10 cargo install cargo-about --version 0.9.3 --features cli --locked -j 4 --root "$RUNNER_TEMP/cargo-about"
      - name: Add license tool to PATH
        if: steps.check.outputs.ready == 'true'
        run: echo "$RUNNER_TEMP/cargo-about/bin" >> "$GITHUB_PATH"
      - name: Zwischenspeicher für nachgeladene Lizenztexte (SHA-256-gepinnt)
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/license-texts
          key: license-texts-v1-${{ hashFiles('scripts/release/licenses/*-sources.json') }}
          restore-keys: license-texts-v1-
      - name: Vollständige Drittlizenzen erzeugen
        timeout-minutes: 60
        if: steps.check.outputs.ready == 'true'
        env:
          OPENSPIDER_LICENSE_CACHE: ${{ runner.temp }}/license-texts
        run: |
          nice -n 10 node scripts/release/licenses/generate.mjs

      - name: Version, Kanal und Updater konfigurieren
        if: steps.check.outputs.ready == 'true'
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "${INPUT_CHANNEL:-stable}" in stable|beta) ;; *) echo "Ungültiger Kanal" >&2; exit 1 ;; esac
          # R04 sets the version and lockfile before calling; never mutate dependencies here.
          node scripts/release/check-version.mjs
          node --input-type=module - <<'JSVERSION'
          import { readVersion } from './scripts/release/check-version.mjs';
          const expected = process.env.RELEASE_VERSION;
          if (expected && expected !== readVersion(process.cwd())) {
            throw new Error('Eingabe version muss der vorbereiteten Workspace-Version entsprechen');
          }
          JSVERSION
          python3 - <<'PYCONFIG'
          import json, os
          enabled = bool(os.environ['TAURI_SIGNING_PRIVATE_KEY'] and os.environ['OPENSPIDER_UPDATER_PUBKEY'])
          channel = '-beta' if os.environ['OPENSPIDER_UPDATE_BETA'] == '1' else ''
          config = {'bundle': {'createUpdaterArtifacts': enabled}, 'plugins': {'updater': {
              'pubkey': os.environ['OPENSPIDER_UPDATER_PUBKEY'],
              'endpoints': [f'https://github.com/wojcikdominik/openspider/releases/latest/download/latest{channel}.json']}}}
          with open(os.environ['RUNNER_TEMP'] + '/macos-build.json', 'w') as f:
              json.dump(config, f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"enabled={str(enabled).lower()}\n")
          PYCONFIG
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$OPENSPIDER_UPDATER_PUBKEY" ]]; then
            echo "::notice::Updater-Artefakte übersprungen: TAURI_SIGNING_PRIVATE_KEY oder OPENSPIDER_UPDATER_PUBKEY fehlt."
            echo "Updater-Artefakte übersprungen: Schlüssel fehlen." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: CLI bauen (Universal per lipo)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/src-tauri/binaries
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            if [[ "$ARCH" == universal || "$TAURI_TARGET" == "$triple" ]]; then
              cargo build -p os-cli --bin openspider --release --target "$triple" -j 4 --locked
              cp "target/$triple/release/openspider" "apps/desktop/src-tauri/binaries/openspider-$triple"
            fi
          done
          if [[ "$ARCH" == universal ]]; then
            lipo -create apps/desktop/src-tauri/binaries/openspider-{x86_64,aarch64}-apple-darwin \
              -output apps/desktop/src-tauri/binaries/openspider-universal-apple-darwin
            lipo -archs apps/desktop/src-tauri/binaries/openspider-universal-apple-darwin
          fi

      - name: Schlüsselbund anlegen und Zertifikat importieren
        if: steps.check.outputs.ready == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/openspider-signing.keychain-db"
          cert="$RUNNER_TEMP/openspider-certificate.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          # Sperrt sich nach 6 Stunden, nicht schon bei Inaktivität mitten im Notarisieren.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"

          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign
          rm -f "$cert"

          # codesign darf den privaten Schlüssel ohne Rückfrage-Dialog benutzen (der Runner hat keine Oberfläche).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null

          # Temporären Schlüsselbund vorn in die Suchliste, die vorhandenen dahinter.
          keychains=("$keychain")
          while IFS= read -r existing; do
            keychains+=("$existing")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "${keychains[@]}"

          if ! security find-identity -v -p codesigning "$keychain" | grep -qF -- "$APPLE_SIGNING_IDENTITY"; then
            echo "Die Identität aus APPLE_SIGNING_IDENTITY steht nicht im importierten Zertifikat. Vorhanden:" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "Signierzertifikat importiert, Identität gefunden."

      # Tauri signiert (Hardened Runtime + entitlements.plist aus tauri.conf.json), notarisiert die App (notarytool, wartet)
      # und heftet das Ticket, sobald APPLE_ID, APPLE_PASSWORD und APPLE_TEAM_ID gesetzt sind; danach entsteht das DMG
      # um die geheftete App. APPLE_CERTIFICATE wird hier bewusst NICHT übergeben: Tauri würde sonst das Zertifikat ein
      # zweites Mal in einen eigenen Schlüsselbund importieren; der Schritt davor hat es bereits bereitgestellt.
      - name: Tauri-Build (signiert und notarisiert)
        if: steps.check.outputs.ready == 'true'
        timeout-minutes: 60
        env:
          OPENSPIDER_REQUIRE_NOTICES: "1"
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run -w apps/desktop tauri -- build --target "$TAURI_TARGET" --config "$RUNNER_TEMP/macos-build.json" --bundles app,dmg -- --locked -j 4

      # Tauri meldet "Stapling app..." und läuft weiter, auch wenn Apple das Ticket noch nicht ausliefert (Lauf
      # 41206175241: App angenommen, aber ohne Ticket, auch im DMG). Deshalb hier mit Wiederholungen heften, die App im
      # DMG ebenso, und das DMG neu packen. Die Signatur des DMG folgt erst im nächsten Schritt.
      - name: App-Ticket heften (auch im DMG)
        if: steps.check.outputs.ready == 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          shopt -s nullglob
          staple() {
            for versuch in 1 2 3 4 5; do
              if xcrun stapler staple "$1" && xcrun stapler validate "$1"; then
                return 0
              fi
              echo "Anheften an $1 fehlgeschlagen (Versuch $versuch), neuer Versuch in 60 s."
              sleep 60
            done
            echo "Anheften an $1 nach 5 Versuchen fehlgeschlagen." >&2
            return 1
          }
          apps=("$BUNDLE_DIR"/macos/*.app)
          dmgs=("$BUNDLE_DIR"/dmg/*.dmg)
          if [[ ${#apps[@]} -ne 1 || ${#dmgs[@]} -ne 1 ]]; then
            echo "Erwartet genau eine App und ein DMG, gefunden: ${#apps[@]} App(s), ${#dmgs[@]} DMG(s)" >&2
            exit 1
          fi
          staple "${apps[0]}"

          dmg="${dmgs[0]}"
          rw="$RUNNER_TEMP/openspider-rw.dmg"
          mnt="$RUNNER_TEMP/openspider-dmg-mnt"
          hdiutil convert "$dmg" -format UDRW -o "$rw" -quiet
          # Platz für das Ticket: das Abbild um 20 MB vergrößern (Tauri packt es knapp).
          cur="$(hdiutil resize -limits "$rw" | awk 'NR == 1 { print $2 }')"
          hdiutil resize -sectors "$((cur + 40960))" "$rw"
          mkdir -p "$mnt"
          hdiutil attach "$rw" -nobrowse -noautoopen -mountpoint "$mnt" -quiet
          inner=("$mnt"/*.app)
          ok=1
          if [[ ${#inner[@]} -ne 1 ]] || ! staple "${inner[0]}"; then
            ok=0
          fi
          hdiutil detach "$mnt" -quiet || hdiutil detach "$mnt" -force -quiet
          if [[ $ok -ne 1 ]]; then
            echo "App im DMG nicht geheftet." >&2
            exit 1
          fi
          hdiutil convert "$rw" -format UDZO -imagekey zlib-level=9 -o "$dmg" -ov -quiet
          rm -f "$rw"

      # Das DMG selbst bekommt eine eigene Signatur, Notarisierung und Heftung (Tauri notarisiert nur die App darin).
      - name: DMG signieren, notarisieren, heften
        if: steps.check.outputs.ready == 'true'
        timeout-minutes: 45
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=("$BUNDLE_DIR"/dmg/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "Erwartet genau ein DMG in $BUNDLE_DIR/dmg, gefunden: ${#dmgs[@]}" >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          echo "DMG: $dmg"

          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"

          result="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" \
            --wait --output-format json > "$result" || true
          cat "$result"
          if ! grep -Eq '"status" *: *"Accepted"' "$result"; then
            id="$(sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' "$result" | head -n 1)"
            if [[ -n "$id" ]]; then
              xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" || true
            fi
            echo "Notarisierung des DMG nicht angenommen." >&2
            exit 1
          fi
          # Apples Ticket-Auslieferung (api.apple-cloudkit.com) bricht auf den Runnern gelegentlich mit
          # NSURLErrorDomain -1005 ab (Läufe 19.10. und 28.10.); das Ticket ist dann längst ausgestellt. Deshalb
          # bis zu fünf Versuche im Abstand von 60 s.
          for versuch in 1 2 3 4 5; do
            if xcrun stapler staple "$dmg"; then
              break
            fi
            if [[ $versuch -eq 5 ]]; then
              echo "Anheften des Tickets nach 5 Versuchen fehlgeschlagen." >&2
              exit 1
            fi
            echo "Anheften fehlgeschlagen (Versuch $versuch), neuer Versuch in 60 s."
            sleep 60
          done

      - name: Prüfen (verify-macos.sh)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          out=release-artifacts
          mkdir -p "$out"
          apps=("$BUNDLE_DIR"/macos/*.app)
          dmgs=("$BUNDLE_DIR"/dmg/*.dmg)
          if [[ ${#apps[@]} -ne 1 || ${#dmgs[@]} -ne 1 ]]; then
            echo "Erwartet je eine App und ein DMG unter $BUNDLE_DIR, gefunden: ${#apps[@]} App, ${#dmgs[@]} DMG" >&2
            exit 1
          fi
          cp "${dmgs[0]}" "$out/"
          # R04: standalone CLI archive from the signed app, including both Universal slices.
          version="$(node --input-type=module -e "import {readVersion} from './scripts/release/check-version.mjs'; console.log(readVersion(process.cwd()))")"
          tar -czf "$out/openspider_${version}_darwin-${ARCH}.tar.gz" \
            -C "${apps[0]}/Contents/MacOS" openspider -C "$GITHUB_WORKSPACE" LICENSE NOTICE
          MACOS_EXPECTED_ARCH="$ARCH" scripts/release/check-macos-bundle.sh --smoke "${apps[0]}"
          if [[ "${{ steps.updater.outputs.enabled }}" == true ]]; then
            updates=("$BUNDLE_DIR"/macos/*.app.tar.gz)
            [[ ${#updates[@]} -eq 1 && -s "${updates[0]}.sig" ]]
            # Unique release-asset names; copying/renaming preserves the signed archive bytes.
            cp "${updates[0]}" "$out/OpenSpider_${ARCH}.app.tar.gz"
            cp "${updates[0]}.sig" "$out/OpenSpider_${ARCH}.app.tar.gz.sig"
          fi
          rc=0
          scripts/release/verify-macos.sh "${apps[0]}" 2>&1 | tee "$out/verify-app.log" || rc=1
          scripts/release/verify-macos.sh "${dmgs[0]}" 2>&1 | tee "$out/verify-dmg.log" || rc=1
          {
            echo "### Prüfprotokoll"
            echo
            echo '```'
            grep -hE '^(ERGEBNIS|Ziel:|\$ |-> )' "$out/verify-app.log" "$out/verify-dmg.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Artefakt hochladen
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openspider-macos-${{ env.ARCH }}
          path: release-artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Schlüsselbund löschen
        if: always() && steps.check.outputs.ready == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/openspider-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/openspider-certificate.p12"
          echo "Temporärer Schlüsselbund entfernt."

  universal-smoke:
    if: needs.macos.result == 'success' && (inputs.arch == '' || inputs.arch == 'all' || inputs.arch == 'universal')
    needs: macos
    environment: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: download
        continue-on-error: true
        with:
          name: openspider-macos-universal
          path: universal-artifact
      - name: Universal-DMG nativ starten (App und CLI)
        if: steps.download.outcome == 'success'
        env:
          MACOS_EXPECTED_ARCH: universal
          OPENSPIDER_SECRET_STORE: memory
          OPENSPIDER_DISABLE_UPDATE_CHECK: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/universal-mount"
          trap 'hdiutil detach -quiet "$RUNNER_TEMP/universal-mount" || true' EXIT
          dmgs=(universal-artifact/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]]
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$RUNNER_TEMP/universal-mount" "${dmgs[0]}"
          scripts/release/check-macos-bundle.sh --smoke "$RUNNER_TEMP/universal-mount/OpenSpider.app"
      - name: Fehlendes Artefakt einordnen
        if: steps.download.outcome != 'success'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::notice::Universal-Smoke übersprungen: Apple-Konfiguration unvollständig."
              exit 0
            fi
          done
          echo "::error::Universal-Artefakt fehlt trotz vollständiger Apple-Konfiguration."
          exit 1

  artifacts:
    if: always() && needs.macos.result == 'success'
    needs: macos
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Vorhandene Artefaktnamen für R04
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          names="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("openspider-macos-")) | .name]' | jq -cs 'add')"
          echo "names=$names" >> "$GITHUB_OUTPUT"
