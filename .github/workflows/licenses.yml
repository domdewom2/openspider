name: Third-party licenses
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generator tests and npm policy
        run: |
          node --test scripts/release/licenses/generate.test.mjs
          npm run -w apps/desktop check:licenses
      - uses: EmbarkStudios/cargo-deny-action@d755fbddac377c2d538f556dd0f9c7728c7f73e4 # v2.0.14
        with:
          command: check licenses
      - name: Cache build-only license tool (MIT OR Apache-2.0)
        id: cargo-about-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cargo-about/bin
          key: cargo-about-0.9.3-cli-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install build-only license tool on cache miss
        if: steps.cargo-about-cache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: timeout 3600s nice -n 10 cargo install cargo-about --version 0.9.3 --features cli --locked -j 4 --root "$RUNNER_TEMP/cargo-about"
      - name: Add license tool to PATH
        run: echo "$RUNNER_TEMP/cargo-about/bin" >> "$GITHUB_PATH"
      - name: Generate complete release notices (all release targets)
        run: timeout 3600s nice -n 10 node scripts/release/licenses/generate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-notices
          path: |
            apps/desktop/src-tauri/resources/third-party/THIRD_PARTY_NOTICES.txt
            apps/desktop/src-tauri/resources/third-party/NOTICE
          if-no-files-found: error
