name: Website

# Leichter Lauf für website/** (B3-REL): ci.yml, linux-core.yml und parity.yml starten bei reinen Website-Commits nicht
# mehr. Statische Seiten (Links, Sprungmarken, Metadaten, Sitemap) und die PHP-Endpunkte unter website/api.
# Deployt wird nur von Hand mit dem Release (docs/release/release-rhythmus.md), nie aus diesem Workflow.

on:
  push:
    branches: [main]
    paths: &site-paths
      - "website/**"
      - "tests/fixtures/crash/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths: *site-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-site:
    name: check-site (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Statische Website prüfen
        run: node website/check-site.mjs
      - name: PHP-Endpunkte (Feedback, Absturzberichte)
        run: |
          set -euo pipefail
          php -l website/api/feedback.php
          php -l website/api/crash.php
          php website/api/tests/feedback_test.php
          php website/api/tests/crash_test.php
