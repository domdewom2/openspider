name: Spec coverage M2

on:
  push:
    branches: [main, 'm2/**']
    # K2-67: Markdown löst keinen Lauf aus, außer was Tests oder Jobs lesen (docs/spec, docs/issues, docs/plan/M2*.md,
    # tests/**). Muster der Reihe nach, später gewinnt.
    paths: &coverage-paths
      - 'crates/**'
      - 'apps/desktop/**'
      - 'core/**'
      - 'docs/plan/M2*.json'
      - 'docs/plan/M1-packages.json'
      - 'docs/plan/*.toml'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'package*.json'
      - '.github/workflows/spec-coverage-m2.yml'
      - '.github/workflows/ui-e2e.yml'
      - '!**/*.md'
      - 'tests/**'
      - 'docs/spec/**'
      - 'docs/issues/**'
      - 'docs/plan/M2*.md'
      # B4-M2CLOSE: Vertragstests AGENT-041/042 lesen auch SKILL.md und Referenzen.
      - 'integrations/**'
  pull_request:
    paths: *coverage-paths
  workflow_dispatch:
    inputs:
      gate:
        description: 'M2-Abnahme über alle Wellen (Q04)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  OPENSPIDER_SECRET_STORE: memory
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  M2_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.gate || false }}

jobs:
  evidence:
    # Pull-Requests von m2/*-Zweigen überspringen den Job: derselbe Stand läuft schon über den Push-Lauf (K2-67).
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'm2/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 04.11.2026 (Läufe 41807021445, 41826776086): Workspace-Testbau lief trotz line-tables-only voll
    # (ld „Bus error“, „No space left on device“). Wie ci.yml ohne Debuginfo bauen.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      # Runde 11: ubuntu-latest lief beim Cache-Speichern voll (No space left on device).
      - name: Speicherplatz schaffen (ungenutzte SDKs des Runners)
        run: |
          df -h / | tail -n 1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/julia* /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -n 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: spec-coverage-m2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Wie ui-e2e.yml: ohne unprivilegierte User-Namespaces startet die Chromium-Sandbox nicht („No usable sandbox“);
      # im Lauf 42037881032 scheiterten daran 16 Rust-Testziele (os-render, os-engine, os-analyze, os-app …), unbemerkt.
      - name: Chromium-Sandbox erlauben (Linux)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      # Schritt-Limit wie im e2e-Job (B3-COV): ein hängender apt-Spiegel soll früh und eindeutig scheitern.
      - name: Playwright-Chromium installieren
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
      - name: Chromium für Rust-Renderingtests
        run: echo "OPENSPIDER_CHROMIUM=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Rust-Tests und echte Ergebnisdatei
        shell: bash
        run: |
          status=0
          cargo test --workspace --exclude openspider-desktop --locked --no-fail-fast > rust-tests.txt 2>&1 || status=$?
          tail -n 40 rust-tests.txt
          echo "Rust-Test-Exit: $status" >> "$GITHUB_STEP_SUMMARY"
          # B3-COV: Fehlschläge immer rot, nicht nur im Gate; der vitest-Schritt und der Upload laufen trotzdem.
          exit "$status"
      - name: vitest-JUnit
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          npm run -w apps/desktop test -- --reporter=default --reporter=junit --outputFile.junit=../../vitest-m2.xml || status=$?
          echo "vitest-Exit: $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # B4-M2CLOSE: Vertragstests von Skill und Plugin (AGENT-041/042, M2-M02, laufen sonst nur in integrations.yml).
      # node:test schreibt die Fälle ohne <testsuite>; os-parity ordnet über Datei bzw. Suite zu, daher eine Suite
      # mit dem Dateipfad. Installation, Slash-Befehl und Marketplace (AGENT-042) prüft weiterhin integrations.yml.
      - name: Integrations-Vertragstests (node:test, JUnit)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          npm ci --prefix integrations --no-audit --no-fund
          (cd integrations && node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=../integrations-raw.xml tests/contracts.test.mjs) || status=$?
          sed -e 's#<testsuites>#<testsuites><testsuite name="integrations/tests/contracts.test.mjs">#' \
            -e 's#</testsuites>#</testsuite></testsuites>#' integrations-raw.xml > integrations-m2.xml
          echo "Integrations-Exit: $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-junit
          path: |
            rust-tests.txt
            vitest-m2.xml
            integrations-m2.xml
          if-no-files-found: error

  # Übergang bis ci.yml/ui-e2e.yml JUnit exportieren (Schnittstellenbedarf im Q01-Bericht).
  # Runner, Browserinstallation, Matrix, Fixture-Werkzeuge und Transport entsprechen ui-e2e.yml (B3-MACIMG: Abweichungen
  # hier ließen beta/*, mcp/bridge, sidebar-chart/live und die macOS-Tab-Tests in allen Läufen scheitern, unbemerkt,
  # weil der Schritt den Exit nur im Gate weitergab). Seit B3-COV machen Fehlschläge den Job immer rot; der
  # Abdeckungsjob läuft wegen `!cancelled()` trotzdem und wertet die JUnit-Belege aus.
  e2e:
    name: e2e (${{ matrix.name }})
    # Pull-Requests von m2/*-Zweigen überspringen den Job: derselbe Stand läuft schon über den Push-Lauf (K2-67).
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'm2/') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS-WebKit in zwei Shards wie ui-e2e.yml: ein Job brauchte 47–54 min Testzeit (Läufe 41989485643,
          # 41999934314) und lief mit Bau und Cache in das 60-min-Limit. Das Perf-Projekt (UI-146) nur im ersten Shard.
          - name: macos-webkit-1
            os: macos-15
            projects: webkit
            browsers: webkit
            shard: 1/2
            perf: true
          - name: macos-webkit-2
            os: macos-15
            projects: webkit
            browsers: webkit
            shard: 2/2
          - name: windows-chromium
            os: windows-latest
            projects: chromium
            browsers: chromium
          # Getrennt wie ui-e2e.yml: beide Engines nacheinander überschreiten 60 min (Lauf 41183672386).
          - name: linux-chromium
            os: ubuntu-latest
            projects: chromium
            browsers: chromium
          - name: linux-webkit
            os: ubuntu-latest
            projects: webkit
            browsers: webkit
    env:
      CARGO_TERM_COLOR: always
      OS_E2E_TRANSPORT: auto
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-e2e
      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: '22'
          cache: npm
      # Wie ui-e2e.yml: ohne unprivilegierte User-Namespaces startet die Chromium-Sandbox des Login-Fensters nicht
      # (auth/bridge.spec.ts:26 scheiterte deshalb unter Linux).
      - name: Chromium-Sandbox erlauben (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      # Sonst ≤ 1 min (apt 114 MB in 4 s). In Lauf 42055703821 (main, f6d98ccf) lieferte der Ubuntu-Spiegel für
      # linux-webkit 110 MB in 48 min 37 s; die Tests begannen erst nach 52 min und das Job-Limit brach ab (B3-COV).
      # Das Schritt-Limit lässt einen solchen Runner früh und eindeutig scheitern, statt die Testzeit aufzubrauchen.
      - name: Playwright-Browser installieren
        timeout-minutes: 15
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            npx playwright install --with-deps ${{ matrix.browsers }}
          else
            npx playwright install ${{ matrix.browsers }}
          fi
      - run: cargo build --locked -p os-app --features e2e-bridge --bin os-app-bridge
      # Wie ui-e2e.yml: beta/*, mcp/bridge und sidebar-chart/live starten os-testsite (sonst „spawn … ENOENT“),
      # alpha/support.ts braucht zusätzlich CLI und Paritätswerkzeug.
      - name: E2E-Fixture-Werkzeuge bauen
        run: cargo build --locked -p os-testsite -p os-cli -p os-parity --bins
      # Wie ui-e2e.yml (N17): ohne native Tastaturnavigation überspringt Tab in WebKit auf macOS native Buttons
      # (a11y/contrast, a11y/grid, a11y/keyboard). https://github.com/microsoft/playwright/issues/41808
      - name: WebKit-Tastaturnavigation einschalten (macOS)
        if: runner.os == 'macOS'
        run: defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
      # Schritt-Limit unter dem Job-Limit: läuft der Testlauf zu lange, bleibt Zeit für die Uploads (Fehlertexte stehen
      # dann in test-results/*/error-context.md und den Traces). Testzeit zuletzt 21–38 min (Lauf 42037881032), Einrichtung
      # bis 10 min (Windows).
      - name: E2E-A mit JUnit
        timeout-minutes: 50
        env:
          OS_E2E_PROJECTS: ${{ matrix.projects }}
          CI: 'true'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ../../playwright-m2.xml
        # Mit Shard nur das Hauptprojekt (wie ui-e2e.yml): `<engine>-perf` hängt davon ab und liefe sonst in jedem
        # Shard ungeteilt mit.
        run: |
          args=("--reporter=list,html,junit")
          if [ -n "${{ matrix.shard }}" ]; then
            args+=(--project=${{ matrix.projects }} --shard=${{ matrix.shard }})
          fi
          status=0
          npm run -w apps/desktop e2e -- "${args[@]}" 2>&1 | tee e2e.log || status=$?
          used=$( (grep -h '^\[e2e\] Transport:' e2e.log || true) | sort -u | tr '\n' ' ')
          echo "E2E-A (${{ matrix.name }}): ${used:-kein Lauf}; Exit: $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Laufzeitbudgets (UI-146) wie ui-e2e.yml nach den Tests des Shards, ohne parallele Last und ohne die
      # Projektabhängigkeit; eigene JUnit-Datei und Ausgabeordner.
      # Läuft auch nach roten Haupttests, damit die Budget-Belege nicht fehlen.
      - name: E2E-A Laufzeitbudgets mit JUnit (Shard)
        if: ${{ !cancelled() && matrix.perf }}
        timeout-minutes: 10
        env:
          OS_E2E_PROJECTS: ${{ matrix.projects }}
          CI: 'true'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ../../playwright-m2-perf.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-perf
        run: |
          status=0
          npm run -w apps/desktop e2e -- --reporter=list,html,junit --project=${{ matrix.projects }}-perf --no-deps \
            --output=test-results-perf 2>&1 | tee -a e2e.log || status=$?
          echo "E2E-A Laufzeitbudgets (${{ matrix.name }}): Exit: $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-junit-${{ matrix.name }}
          path: |
            playwright-m2.xml
            playwright-m2-perf.xml
          if-no-files-found: error
      # Report, Traces und error-context.md auch bei Fehlschlag oder Schritt-Zeitüberschreitung sichern.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-m2-${{ matrix.name }}
          path: |
            e2e.log
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            apps/desktop/playwright-report-perf/
            apps/desktop/test-results-perf/
          retention-days: 14
          if-no-files-found: ignore

  spec-coverage-m2:
    name: spec-coverage-m2
    needs: [evidence, e2e]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'm2/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: spec-coverage-m2-report
      - uses: actions/download-artifact@v4
        continue-on-error: ${{ env.M2_GATE != 'true' }}
        with:
          name: vitest-junit
          path: evidence/core
      - uses: actions/download-artifact@v4
        continue-on-error: ${{ env.M2_GATE != 'true' }}
        with:
          pattern: playwright-junit-*
          path: evidence/e2e
      - name: Spec-Abdeckung und Anhang B
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          args=()
          if [[ "$M2_GATE" == "true" ]]; then args+=(--gate); fi
          # C1: gemergte Besitzer aus der main-Historie; keine Fachpakete pauschal erzwingen.
          # B4-M2CLOSE: os-parity erkennt die Pakete selbst (coverage/merged.rs, mit Test): Titel „m2: Merge
          # [m2/][M2-]<Zweig>“, „m2: Integration Runde N – merge m2/<Zweig>“, „merge: m2/<Zweig> … in Integrationsrunde N“
          # (längster Bindestrich-Präfix, der eine Paket-ID ist) und das Feld `merged_via` in M2-packages.json für
          # Pakete, die über einen Integrationszweig kamen. Ergebnis in M2-status.json (`merged_packages`,
          # `other_merge_branches`, `merged_via_missing`).
          git log origin/main --format='%H%x09%s' > main-merges.txt
          args+=(--merged-log main-merges.txt)
          shopt -s nullglob
          # Fünf Matrix-Jobs (macOS-WebKit in zwei Shards) mit je playwright-m2.xml, der erste macOS-Shard zusätzlich
          # mit den Laufzeitbudgets (playwright-m2-perf.xml).
          junit_files=(evidence/e2e/*/playwright-m2.xml)
          perf_files=(evidence/e2e/*/playwright-m2-perf.xml)
          # Fehlende Matrix-Belege sind sichtbar und machen nur das manuelle Gate rot.
          missing=0
          if [[ ${#junit_files[@]} -ne 5 || ${#perf_files[@]} -ne 1 ]]; then missing=1; fi
          for file in "${junit_files[@]}" "${perf_files[@]}"; do args+=(--frontend-junit "$file"); done
          # B4-M2CLOSE: node:test-Verträge AGENT-041/042 aus dem evidence-Job.
          if [[ -f evidence/core/integrations-m2.xml ]]; then args+=(--frontend-junit evidence/core/integrations-m2.xml); fi
          status=0
          cargo run --locked -p os-parity -- coverage --milestone M2 \
            --test-output evidence/core/rust-tests.txt --frontend-junit evidence/core/vitest-m2.xml \
            --write target/M2-status.json --strict "${args[@]}" > coverage-m2.txt 2>&1 || status=$?
          cat coverage-m2.txt
          cat coverage-m2.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Abdeckungs-Exit: $status; fehlende Matrix-Belege: $missing; Gate: $M2_GATE" >> "$GITHUB_STEP_SUMMARY"
          # Außerhalb des Gates bleibt der Schritt weich, aber nicht stumm (B3-COV).
          if [[ "$status" -ne 0 ]]; then
            echo "::warning title=Spec-Abdeckung M2::os-parity coverage Exit $status (Gate: $M2_GATE), Details in coverage-m2.txt"
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "::warning title=Spec-Abdeckung M2::Matrix-Belege unvollständig: ${#junit_files[@]} von 5 playwright-m2.xml, ${#perf_files[@]} von 1 playwright-m2-perf.xml"
          fi
          if [[ "$M2_GATE" == "true" ]]; then
            if [[ "$missing" -ne 0 ]]; then exit 1; fi
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-coverage-m2
          path: |
            evidence/
            main-merges.txt
            coverage-m2.txt
            target/M2-status.json
          if-no-files-found: warn
