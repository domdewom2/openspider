; Example configuration for website/api/crash.php. Copy it OUTSIDE the web root,
; fill in real values there and point OPENSPIDER_CRASH_CONFIG at the copy.
; Never commit the real file.

; Directory for crash-YYYYMMDD-HHMMSS-<ref>.json (created with mode 0700 if missing).
data_dir = /path/outside/webroot/crash/data
; Directory for the daily salt and the hashed rate-limit files.
salt_dir = /path/outside/webroot/crash/salt
; Recipient of the notification mails.
mail_to = crash-inbox@example.invalid
; Sender address of the notification mails.
mail_from = no-reply@example.invalid
