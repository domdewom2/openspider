; Example configuration for website/api/feedback.php. Copy it OUTSIDE the web root,
; fill in real values there and point OPENSPIDER_FEEDBACK_CONFIG at the copy.
; Never commit the real file.

; Directory for feedback-YYYY-MM.jsonl (created with mode 0700 if missing).
data_dir = /path/outside/webroot/feedback/data
; Directory for the daily salt and the hashed rate-limit files.
salt_dir = /path/outside/webroot/feedback/salt
; Recipient of the notification mails.
mail_to = feedback-inbox@example.invalid
; Sender address of the notification mails.
mail_from = no-reply@example.invalid
