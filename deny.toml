# cargo-deny: `cargo deny check licenses bans sources advisories` (siehe docs/ARCHITECTURE.md, Qualitätssicherung)
#
# Lizenzpolitik: OpenSpider steht unter Apache-2.0. Erlaubt sind ausschließlich
# freizügige, mit Apache-2.0 kompatible Lizenzen (OSI-approved bzw. gleichwertig) plus
# MPL-2.0 (schwaches, dateibezogenes Copyleft). Alles andere – insbesondere GPL, LGPL,
# AGPL, SSPL, EUPL, CC-BY-SA – fällt nicht unter `allow` und lässt den Check scheitern.
# Neue Lizenzen nur nach Prüfung hier aufnehmen.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[licenses]
confidence-threshold = 0.8
# Die Liste darf Lizenzen enthalten, die aktuell keine Abhängigkeit nutzt (Richtlinie, kein Inventar).
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]

[advisories]
# Ein neues Advisory macht den CI-Job `deny` rot und wird als Nacharbeitspaket behandelt (K-82);
# ignoriert wird nur, wofür es keinen Fix im SemVer-Bereich gibt, jeweils mit Pfad, Erreichbarkeit und Grund.
ignore = [
    { id = "RUSTSEC-2022-0081", reason = "K2-57: xee-xpath verwendet json über xee-interpreter; unmaintained-Hinweis, keine gemeldete Sicherheitslücke. XPath-Ersatz im Fachpaket D15 prüfen." },
    { id = "RUSTSEC-2024-0370", reason = "K2-57: xee-xpath verwendet proc-macro-error über xot/genawaiter; unmaintained-Hinweis, keine gemeldete Sicherheitslücke. Nur Build-Zeit; Ersatz mit Bibliotheksupdate prüfen." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 ist unmaintained (Hinweis, keine Schwachstelle); es gibt keine behobene Version. Pfad: nur dev-dependency von os-parse (Tests pixel_license, pixel_font_tables und Beispiel-Generator gen_pixel_metrics). Erreichbarkeit: nicht in ausgelieferten Binaries (Bibliothek, CLI, Desktop-App), liest ausschließlich die im Repo eingecheckten Schriftdateien, kein Netz- oder Nutzereingang. Nachfolger skrifa (fontations) wird bei einer Überarbeitung des Generators geprüft; ein Wechsel braucht Cargo.toml-Änderungen und gehört nicht in dieses Paket." },
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 kommt nur transitiv über calamine 0.36.1 (aktuellste Version, zip ^8, kein Fix im SemVer-Bereich; Behebung erst mit zip >=9.0.0). Betroffen ist ausschließlich ZipArchive::extract bzw. ZipStreamReader::extract (Entpacken auf die Platte); calamine liest XLSX/ODS-Einträge nur im Speicher und ruft extract nirgends auf, OpenSpider entpackt keine Archive. Pfad: os-engine, os-export, os-cli (XLSX-Import). Erreichbarkeit: nicht gegeben. Wird aufgehoben, sobald calamine zip 9 verwendet." },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 kommt nur transitiv über calamine 0.36.1 (aktuellste Version, zip ^8, kein Fix im SemVer-Bereich; Behebung erst mit zip >=9.0.0). Betroffen ist ausschließlich ZipArchive::extract bzw. ZipStreamReader::extract (Entpacken auf die Platte); calamine liest XLSX/ODS-Einträge nur im Speicher und ruft extract nirgends auf, OpenSpider entpackt keine Archive. Pfad: os-engine, os-export, os-cli (XLSX-Import). Erreichbarkeit: nicht gegeben. Wird aufgehoben, sobald calamine zip 9 verwendet." },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 kommt nur transitiv über calamine 0.36.1 (aktuellste Version, zip ^8, kein Fix im SemVer-Bereich; Behebung erst mit zip >=9.0.0). Betroffen ist ausschließlich ZipArchive::extract bzw. ZipStreamReader::extract (Entpacken auf die Platte); calamine liest XLSX/ODS-Einträge nur im Speicher und ruft extract nirgends auf, OpenSpider entpackt keine Archive. Pfad: os-engine, os-export, os-cli (XLSX-Import). Erreichbarkeit: nicht gegeben. Wird aufgehoben, sobald calamine zip 9 verwendet." },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
