# cargo-deny: `cargo deny check licenses bans sources advisories` (siehe docs/ARCHITECTURE.md, Qualitätssicherung)
#
# Lizenzpolitik: OpenSpider steht unter Apache-2.0. Erlaubt sind ausschließlich
# freizügige, mit Apache-2.0 kompatible Lizenzen (OSI-approved bzw. gleichwertig) plus
# MPL-2.0 (schwaches, dateibezogenes Copyleft). Alles andere – insbesondere GPL, LGPL,
# AGPL, SSPL, EUPL, CC-BY-SA – fällt nicht unter `allow` und lässt den Check scheitern.
# Neue Lizenzen nur nach Prüfung hier aufnehmen.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[licenses]
confidence-threshold = 0.8
# Die Liste darf Lizenzen enthalten, die aktuell keine Abhängigkeit nutzt (Richtlinie, kein Inventar).
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]

[advisories]
# Ein neues Advisory macht den CI-Job `deny` rot und wird als Nacharbeitspaket behandelt (K-82);
# ignoriert wird nur, wofür es keinen Fix im SemVer-Bereich gibt, jeweils mit Pfad, Erreichbarkeit und Grund.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 ist unmaintained (Hinweis, keine Schwachstelle); es gibt keine behobene Version. Pfad: nur dev-dependency von os-parse (Tests pixel_license, pixel_font_tables und Beispiel-Generator gen_pixel_metrics). Erreichbarkeit: nicht in ausgelieferten Binaries (Bibliothek, CLI, Desktop-App), liest ausschließlich die im Repo eingecheckten Schriftdateien, kein Netz- oder Nutzereingang. Nachfolger skrifa (fontations) wird bei einer Überarbeitung des Generators geprüft; ein Wechsel braucht Cargo.toml-Änderungen und gehört nicht in dieses Paket." },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
