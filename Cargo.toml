[workspace]
resolver = "2"
members = [
    "crates/os-model",
    "crates/os-url",
    "crates/os-fetch",
    "crates/os-parse",
    "crates/os-render",
    "crates/os-store",
    "crates/os-engine",
    "crates/os-analyze",
    "crates/os-export",
    "crates/os-integrations",
    "crates/os-mcp",
    "crates/os-parity",
    "crates/os-cli",
    "crates/os-testsite",
    "crates/os-loadtest",
    "crates/os-app",
    "crates/os-sched",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# M2-F01: kleinste Rust-Version, die alle Abhängigkeiten zulassen (roaring 0.11 verlangt 1.90); rust-toolchain.toml nimmt den Kanal stable
rust-version = "1.90"
repository = "https://github.com/domdewom2/openspider"
authors = ["OpenSpider contributors"]

[workspace.dependencies]
# interne Crates
os-model = { path = "crates/os-model" }
os-url = { path = "crates/os-url" }
os-fetch = { path = "crates/os-fetch" }
os-parse = { path = "crates/os-parse" }
os-render = { path = "crates/os-render" }
os-store = { path = "crates/os-store" }
os-engine = { path = "crates/os-engine" }
os-analyze = { path = "crates/os-analyze" }
os-export = { path = "crates/os-export" }
os-integrations = { path = "crates/os-integrations" }
os-mcp = { path = "crates/os-mcp" }
os-parity = { path = "crates/os-parity" }
os-testsite = { path = "crates/os-testsite" }
# M2 (docs/plan/M2.md 3.1/3.2)
os-app = { path = "crates/os-app" }
os-sched = { path = "crates/os-sched" }

# extern
serde = { version = "1", features = ["derive"] }
url = "2"
# os-url (P01): Anzeigeform (IDN/Non-ASCII dekodiert) und Prozent-Dekodierung der Normalisierung
idna = "1"
percent-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled", "collation", "functions"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
h2 = "0.4.20"
rustls-platform-verifier = "0.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
toml = "0.9"
serde_json = "1"

# M1 (docs/plan/M1.md 3.1) – von den Paketen über `workspace = true` eingebunden
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
futures-util = "0.3"
# Keine automatische Dekompression (gzip/brotli/deflate-Features bewusst aus): Transfer-Bytes werden selbst gezählt.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "socks", "system-proxy"] }
flate2 = "1"
# os-fetch: Reason-Phrase der Statuszeile (hyper::ext::ReasonPhrase); Version aus dem Lock
hyper = { version = "1", default-features = false, features = ["http1"] }
brotli = "9"
cookie_store = "0.22"
md-5 = "0.11"
hex = "0.4"
keyring = "4"
fancy-regex = "0.19"
psl = "2"
scraper = "0.27"
# direkt für den Parser-Treiber mit scripting_enabled = false (os-parse::dom); dieselbe Version wie in scraper
html5ever = "0.39"
ego-tree = "0.11"
encoding_rs = "0.8"
quick-xml = "0.42"
lopdf = "0.45"
unicode-segmentation = "1"
# os-store (P00c): Kollation OS_TEXT = ICU4X-Collator, Root-Locale, Stärke Secondary (Lizenz Unicode-3.0)
icu_collator = { version = "2", features = ["compiled_data"] }
csv = "1"
# constant_memory: Blätter laufen zeilenweise über eine temporäre Datei (zieht tempfile); 1-Mio.-Zeilen-Export
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }
calamine = "0.36"
base64 = "0.23"
# STDIO-Server (P18/P27) und Client (Tests): Kindprozess- und In-Process-Transport für die Integrationstests
rmcp = { version = "3", default-features = false, features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server"] }
strsim = "0.11"
dirs = "7"
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.14"
schemars = "1"
libc = "0.2"
tempfile = "3"
# nur Windows (P28, RSS über GetProcessMemoryInfo): in den Crate-Manifesten unter [target.'cfg(windows)'.dependencies]
# Win32_System_SystemInformation/Win32_Storage_FileSystem: physischer RAM und freier Speicher (P07, CRAWL-124);
# Win32_System_Console: Ctrl-C-Ereignis in den CLI-Tests (P26)
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
# dev-Abhängigkeiten (Property-Rundreise P13, Schriftgenerator UI-038)
proptest = "1"
ttf-parser = "0.25"

# M2 (docs/plan/M2.md 3.1) – von den Paketen über `workspace = true` eingebunden; Lizenzen gegen deny.toml geprüft (M2-F01)
# os-analyze (Bitmaps/Permutationen der View-Sitzungen, K-1) und os-app (Segment-/Vergleichsfilter); os-store speichert den view_cache-BLOB opak
roaring = "0.11"
# os-app: DTOs → apps/desktop/src/ipc/gen/<Typ>.ts; große Ganzzahlen werden als `number` ausgegeben (UrlId < 2^53), siehe os-app dto::export_all
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
# os-render (R01): Chromium über das DevTools-Protokoll
chromiumoxide = "0.9"
# os-app (K09): Zeilen-/Wortdiff des Quelltexts
similar = "3"
# os-app (Bridge, Feature e2e-bridge)
tokio-tungstenite = "0.30"
# os-integrations (INTEG-003): nur die Protokollschicht, der HTTP-Client kommt über reqwest 0.13 (kein zweites reqwest im Baum)
oauth2 = { version = "5", default-features = false }
# os-app (OUT-223): Authentifizierungsprofile (.osauth) = XChaCha20-Poly1305 + Argon2id, so legt es die Spec fest (Entscheidung
# der Nachbesserungsrunde; ersetzt das im Plan 3.1 genannte aes-gcm). Beide MIT OR Apache-2.0.
chacha20poly1305 = "0.11"
argon2 = "0.6"
# os-sched (OUT-280): SMTP über rustls/ring (kein OpenSSL)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
# dev: Benchmarks der Kern- und App-Crates (`[[bench]] harness = false`)
criterion = { version = "0.8", default-features = false }
# os-parse (ONPAGE-153): Spracherkennung der Rechtschreibprüfung
whatlang = "0.18"
# os-parse (ONPAGE-153, Klärung K2-03): Hunspell-kompatible Rechtschreibung, MPL-2.0
spellbook = "0.4"

# M2-F05a: komprimierte HTML-Ablage.
zstd = "0.13"

# Welle-1-Vorbau (K2-57; MIT/Apache-2.0).
xee-xpath = "0.1"
sha2 = "0.11"
aes-gcm = "0.10"
webbrowser = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sysinfo = "0.37"
getrandom = "0.4"
