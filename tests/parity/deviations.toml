# Dokumentierte Paritaetsabweichungen (docs/plan/M1.md 5.3, Schritt 4). Stand M1-N18 (Welle 6b).
#
# Jede Abweichung zwischen OpenSpider und den Referenz-Exporten (Referenzprodukt (Free-Version)) ist entweder ein Fehler (-> Nachbesserungs-
# auftrag im Abnahmebericht docs/plan/M1-acceptance/checklist.md, ohne Eintrag hier) oder steht hier mit Spec-ID und
# Kennzeichen. Der Runner `os-parity` wendet die Eintraege beim Vergleich an und weist sie im Bericht aus.
#
# Abschnitt 1: begruendete Paritaetsabweichungen (DEV-nnn): die OpenSpider-Spec legt das Verhalten fest (OS-Festlegung,
#              Annahme) oder weicht bewusst von der Referenz ab (Paritaetsabweichung).
# Abschnitt 2: Referenzeinschraenkungen (Free) (REF-FREE-nn, K-53): die Spider-Konfiguration der Free-Version ist gesperrt;
#              diese Eintraege zaehlen NICHT als begruendete Paritaetsabweichung, die betroffenen Filter erhalten kein
#              `verified` (Beleg bleibt der spec-abgeleitete Fixture-Test, A2).
#
# Schema (jede Abweichung ein Block; alle Textwerte als TOML-Strings):
#
# [[deviation]]
# id = "DEV-001"                  # fortlaufend, eindeutig
# spec = "ONPAGE-081"             # Spec-ID, auf die sich die Abweichung bezieht
# kind = "Annahme"                # "Paritaetsabweichung" | "Annahme" | "OS-Festlegung" (Kennzeichen aus der Spec)
# export = "internal_all"         # Mapping-Slug aus tests/parity/mappings oder "*" fuer alle Exporte
# site = "*"                      # Site-Name oder "*"
# column = "Title 1 Pixel Width"  # optional: nur diese (OpenSpider-)Spalte
# address = "{BASE}/x.html"       # optional: nur diese Zeile (Adresse nach Normalisierung)
# reason = "Kurze Begruendung, wie in der Spec festgelegt"
#
# Weitere optionale Felder (M1-P29): export/site/column duerfen mehrere Werte nennen, getrennt durch "|"; key_prefix
# (Zeilen, deren Schluessel so beginnt), key_prefixes (Liste), scope ("cell" Standard | "missing_in_os" | "extra_in_os"),
# ref / os (nur bei diesem Referenz- bzw. OpenSpider-Wert), delta (nur wenn OpenSpider-Wert minus Referenzwert so gross ist).

[[deviation]]
id = "DEV-003"
spec = "ONPAGE-011"
kind = "OS-Festlegung"
export = "internal_all|internal_m2|list_internal"
site = "*"
column = "Title 1 Length|Title 1 Pixel Width|Title 2 Length|Title 2 Pixel Width|Meta Description 1 Length|Meta Description 1 Pixel Width|Meta Description 2 Length|Meta Description 2 Pixel Width|Meta Keywords 1 Length|Meta Keywords 2 Length|H1-1 Length|H1-2 Length|H2-1 Length|H2-2 Length|Word Count"
ref = "0"
os = ""
reason = "Nicht-HTML-URLs sowie Weiterleitungen, Fehlerseiten (4xx/5xx) und URLs ohne Antwort haben leere Element-, Laengen- und Pixelspalten, auch wenn ihr Koerper <title>/<h1> enthaelt (ONPAGE-011, A-5, K-60, Befund N-01), und eine Seite ohne Element leere Wertspalten (ONPAGE-008); die Referenz schreibt 0."

