# Absichtserklaerung der Fixture "parity-onpage" je Tab/Filter (erzeugt von tests/parity/gen/generate.py).
# hit  = URLs, die nach Spec im Filter stehen muessen; miss = URLs, die nicht darin stehen duerfen.
# Adressen: "/pfad" intern, "ext:/pfad" externer Host localhost, "dead:<url>" nicht erreichbar.
# [[report]] = Absichtserklaerung zu einem Report ohne Filter (z. B. Redirects to Errors): hit/miss
# als "<Adresse> -> <Endziel>" (Treffer) bzw. Adresse (Nicht-Treffer).
# [[report]] = Absichtserklaerung zu einem Report ohne Filter (z. B. Redirects to Errors).
# Wird von tests/parity/fixtures_check.rs gegen die ausgelieferte Site geprueft.
site = "parity-onpage"

[[case]]
tab = "Page Titles"
filter = "All"
hit = ["/titles/ok-1.html", "/titles/missing-none.html"]
miss = ["/img/small.png"]

[[case]]
tab = "Page Titles"
filter = "Missing"
hit = ["/titles/missing-none.html", "/titles/missing-empty.html", "/titles/missing-spaces.html"]
miss = ["/titles/ok-1.html", "/titles/multi-two.html", "/titles/len-30.html"]

[[case]]
tab = "Page Titles"
filter = "Duplicate"
hit = ["/titles/dup-a.html", "/titles/dup-b.html"]
miss = ["/titles/dup-case.html", "/titles/dup-canonical.html", "/titles/ok-1.html"]

[[case]]
tab = "Page Titles"
filter = "Over 60 Characters"
hit = ["/titles/len-61.html", "/titles/pixel-i70.html"]
miss = ["/titles/len-60.html", "/titles/len-58-padded.html", "/titles/ok-1.html"]

[[case]]
tab = "Page Titles"
filter = "Below 30 Characters"
hit = ["/titles/len-29.html"]
miss = ["/titles/len-30.html", "/titles/missing-none.html", "/titles/ok-1.html"]

[[case]]
tab = "Page Titles"
