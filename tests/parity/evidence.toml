# N06: Deklarative M1-Einzelbelege. B3g/SQ-01 wird von coverage ohne --evidence direkt aus den Filterkatalogen berechnet.
# Kein generiertes Q02-Laufjournal und keine Kandidaten als Verifikation.

# M2-Q02: Belegregeln wie coverage/evidence.rs: URL-Menge identisch, null Zellfehler,
# keine angewandte REF-FREE-Ausnahme. Schwellen allein ergeben kein verified.

[[evidence]]
specs = ["ONPAGE-012"]
exports = ["internal_all", "internal_m2", "list_internal"]
columns = ["Size (Bytes)", "Transferred (Bytes)", "Total Transferred (Bytes)"]
url_set = false

[[evidence]]
specs = ["ONPAGE-120"]
exports = ["h1_all"]

[[evidence]]
specs = ["ONPAGE-130"]
exports = ["h2_all"]

[[evidence]]
specs = ["TECH-010", "TECH-011"]
exports = ["canonicals_all"]
columns = ["Occurrences", "Indexability", "Indexability Status", "Canonical Link Element 1", "Canonical Link Element 2", "Canonical Link Element 3", "HTTP Canonical", "rel=\"next\" 1", "rel=\"prev\" 1"]
