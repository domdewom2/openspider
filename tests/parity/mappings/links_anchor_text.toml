# M2-P01: Spec-abgeleitete Spalten; keine Referenzwerte oder Beschreibungstexte.
key = ["Source", "Destination", "#"]
drop_ref_columns = ["Description", "How To Fix"]

[columns]
"Source" = "Source"
"Destination" = "Destination"
"Anchor" = "Anchor"
"Alt Text" = "Alt Text"
"Link Position" = "Link Position"
"Follow" = "Follow"
"Status Code" = "Status Code"

[normalize]
base_url = true
trim = true
bool = "case-insensitive"
number_decimals = 3
empty_equals_null = true
