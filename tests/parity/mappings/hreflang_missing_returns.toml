# N06: Spaltensatz nach Referenzkopfzeile; Soll und Ignoriergründe aus der Spec.
key = ["URL Missing Return Link", "URL Not Returning Link", "#"]
drop_ref_columns = ["Description", "How To Fix"]

[columns]
"URL Missing Return Link" = "Address"
"URL Not Returning Link" = "Hreflang URL"
"Expected Link" = "Missing Return Link To"
"Response Code" = "Hreflang URL Status Code"
"hreflang" = "Hreflang Language"

[normalize]
bool = "case-insensitive"
base_url = true
trim = true
number_decimals = 3
empty_equals_null = true
