# M2-P01: Spec-abgeleitete Spalten; keine Referenzwerte oder Beschreibungstexte.
key = ["Address", "Hreflang URL", "#"]
drop_ref_columns = ["Description", "How To Fix"]

[columns]
"Address" = "Address"
"Hreflang Language" = "Hreflang Language"
"Hreflang URL" = "Hreflang URL"
"Hreflang URL Status Code" = "Hreflang URL Status Code"
"Hreflang URL Indexability" = "Hreflang URL Indexability"
"Missing Return Link To" = "Missing Return Link To"

[normalize]
base_url = true
trim = true
bool = "case-insensitive"
number_decimals = 3
empty_equals_null = true
