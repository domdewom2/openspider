# Spaltenmapping SF -> OpenSpider fuer den Export "Bulk Export Response Codes:All Error Inlinks" (Format: docs/plan/M1.md 5.2).
# Spaltennamen rechts sind die kanonischen OpenSpider-Namen aus der Spec; Annahme: die Referenz nutzt dieselben
# funktionalen Bezeichner. Abweichungen klaert M1-P29 anhand der echten Exporte.
# Gleiches Standard-Linkformat wie all_inlinks (OUT-031, OUT-067).
key = ["Source", "Destination", "Type", "#"]
drop_sf_columns = ["Description", "How To Fix"]   # Clean-Room: Texte der Referenz nie einlesen

[columns]
"Type" = "Type"
"Source" = "Source"
"Destination" = "Destination"
"Size (Bytes)" = "Size (Bytes)"
"Alt Text" = "Alt Text"
"Anchor" = "Anchor"
"Status Code" = "Status Code"
"Status" = "Status"
"Follow" = "Follow"
"Target" = "Target"
"Rel" = "Rel"
"Path Type" = "Path Type"
"Link Path" = "Link Path"
"Link Position" = "Link Position"
"Link Origin" = "Link Origin"

[normalize]
base_url = true          # http://127.0.0.1:<port> -> {BASE}, http://localhost:<port> -> {EXT}
trim = true
bool = "case-insensitive"
number_decimals = 3      # Zahlen werden nach Rundung verglichen
empty_equals_null = true
