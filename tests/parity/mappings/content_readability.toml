# N06: Spaltensatz nach Referenzkopfzeile; Soll und Ignoriergründe aus der Spec.
key = ["Address"]
drop_ref_columns = ["Description", "How To Fix"]

[columns]
"Address" = "Address"
"Word Count" = "Word Count"
"Sentence Count" = "Sentence Count"
"Average Words Per Sentence" = "Average Words Per Sentence"
"Flesch Reading Ease Score" = "Flesch Reading Ease Score"
"Readability" = "Readability"
"Indexability" = "Indexability"
"Indexability Status" = "Indexability Status"

[normalize]
bool = "case-insensitive"
base_url = true
trim = true
number_decimals = 3
empty_equals_null = true
