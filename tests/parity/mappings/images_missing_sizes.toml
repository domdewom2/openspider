# M2-P01: Spec-abgeleitete Spalten; keine Referenzwerte oder Beschreibungstexte.
key = ["From", "To", "#"]
drop_ref_columns = ["Description", "How To Fix"]

[columns]
"From" = "From"
"To" = "To"
"Alt Text" = "Alt Text"
"Size" = "Size"
"Real Dimensions (WxH)" = "Real Dimensions (WxH)"
"Dimensions in Attributes (WxH)" = "Dimensions in Attributes (WxH)"
"Display Dimensions (WxH)" = "Display Dimensions (WxH)"
"Potential Savings" = "Potential Savings"
"Path Type" = "Path Type"
"Link Path" = "Link Path"
"Link Position" = "Link Position"
"Link Origin" = "Link Origin"

[normalize]
base_url = true
trim = true
bool = "case-insensitive"
number_decimals = 3
empty_equals_null = true
