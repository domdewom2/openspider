chain_end_target = true
# Spaltenmapping Referenz -> OpenSpider fuer den Export "Report Redirects:Redirect Chains" (Format: docs/plan/M1.md 5.2).
# Stand M1-P29 (Welle 5): an die echten Kopfzeilen der Referenz (Referenzprodukt (Free-Version), englische Oberflaeche) angepasst.
# Nur Spaltennamen der Kopfzeile; Beschreibungsspalten werden beim Einlesen verworfen (Clean-Room, A8).
# Die Referenz schreibt eine Zeile je verlinkender Quelle (`Source`); OpenSpider eine Zeile je Start-URL (OS-Festlegung, OUT-081).
# `dedupe_reference` faltet gleiche `Address`-Zeilen der Referenz zu einer; die Quelle/Linkspalten werden nicht verglichen.
key = ["Address"]
drop_ref_columns = ["Description", "How To Fix"]   # Clean-Room: Texte der Referenz nie einlesen
dedupe_reference = true

[columns]
"Number of Redirects/Canonicals" = { os = "Number of Redirects", optional_ref = true }
"Number of Canonicals" = { os = "Number of Redirects", optional_ref = true }
"Chain Type" = "Chain Type"
"Number of Redirects" = { os = "Number of Redirects", optional_ref = true }
"Loop" = { os = "Redirect Loop" }
"Source" = { ignore = true, reason = "OS-Festlegung (OUT-081): eine Zeile je Start-URL statt je verlinkender Quelle; OpenSpider nennt `Sample Source`" }
"Temp Redirect in Chain" = { os = "Temp Redirect in Chain", optional_ref = true }
"Address" = "Address"
"Final Address" = "Final Address"
"Final Indexability" = "Final Indexability"
"Final Indexability Status" = { os = "Final Indexability Status", transform = ["ignore_case"] }
"Final Content" = { os = "Final Content Type" }
"Final Status Code" = "Final Status Code"
"Final Status" = { os = "Final Status", transform = ["ignore_case"] }
