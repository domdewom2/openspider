# Spaltenmapping SF -> OpenSpider fuer den Export "Links:All" (Format: docs/plan/M1.md 5.2).
# Spaltennamen rechts sind die kanonischen OpenSpider-Namen aus der Spec; Annahme: die Referenz nutzt dieselben
# funktionalen Bezeichner. Abweichungen klaert M1-P29 anhand der echten Exporte.
key = ["Address"]
drop_sf_columns = ["Description", "How To Fix"]   # Clean-Room: Texte der Referenz nie einlesen

[columns]
"Address" = "Address"
"Indexability" = "Indexability"
"Indexability Status" = "Indexability Status"
"Crawl Depth" = "Crawl Depth"
"Link Score" = { ignore = true, reason = "nicht in M1 (P1/P2)" }
"Inlinks" = { ignore = true, reason = "Spalte steht nicht in der Referenz-Spaltenliste des Links-Tabs (TECH-130)" }
"Unique Inlinks" = "Unique Inlinks"
"Unique JS Inlinks" = { ignore = true, reason = "nur mit JavaScript-Rendering (M2)" }
"% of Total" = "% of Total"
"Outlinks" = "Outlinks"
"Unique Outlinks" = "Unique Outlinks"
"Unique JS Outlinks" = { ignore = true, reason = "nur mit JavaScript-Rendering (M2)" }
"External Outlinks" = "External Outlinks"
"Unique External Outlinks" = "Unique External Outlinks"
"Unique External JS Outlinks" = { ignore = true, reason = "nur mit JavaScript-Rendering (M2)" }

[normalize]
base_url = true          # http://127.0.0.1:<port> -> {BASE}, http://localhost:<port> -> {EXT}
trim = true
bool = "case-insensitive"
number_decimals = 3      # Zahlen werden nach Rundung verglichen
empty_equals_null = true
