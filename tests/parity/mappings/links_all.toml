# Spaltenmapping Referenz -> OpenSpider fuer den Export "Links:All" (Format: docs/plan/M1.md 5.2).
# Stand M1-P29 (Welle 5): an die echten Kopfzeilen der Referenz (Referenzprodukt (Free-Version), englische Oberflaeche) angepasst.
# Nur Spaltennamen der Kopfzeile; Beschreibungsspalten werden beim Einlesen verworfen (Clean-Room, A8).
key = ["Address"]
drop_ref_columns = ["Description", "How To Fix"]   # Clean-Room: Texte der Referenz nie einlesen

[columns]
"Address" = "Address"
"Indexability" = "Indexability"
"Indexability Status" = { os = "Indexability Status", transform = ["ignore_case"] }
"Crawl Depth" = "Crawl Depth"
"Link Score" = { ignore = true, reason = "SQ-10 / DEV-037: TECH-145 OS-Festlegung, Kalibrierung M3; keine verified-Gutschrift für Links/Internal" }
"Inlinks" = "Inlinks"
"Unique Inlinks" = "Unique Inlinks"
"Unique JS Inlinks" = { ignore = true, reason = "nur mit JavaScript-Rendering (M2)" }
"% of Total" = { os = "% of Total", transform = ["decimal_comma"] }
"Outlinks" = "Outlinks"
"Unique Outlinks" = "Unique Outlinks"
"Unique JS Outlinks" = { ignore = true, reason = "nur mit JavaScript-Rendering (M2)" }
"External Outlinks" = "External Outlinks"
"Unique External Outlinks" = "Unique External Outlinks"
"Unique External JS Outlinks" = { ignore = true, reason = "nur mit JavaScript-Rendering (M2)" }

[normalize]
base_url = true          # http://127.0.0.1:<port> -> {BASE}, http://localhost:<port> -> {EXT}
trim = true
bool = "case-insensitive"
number_decimals = 3      # Zahlen werden nach Rundung verglichen
empty_equals_null = true
