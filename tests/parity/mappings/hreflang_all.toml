# Spaltenmapping SF -> OpenSpider fuer den Export "Hreflang:All" (Format: docs/plan/M1.md 5.2).
# Stand M1-P29 (Welle 5): an die echten Kopfzeilen der Referenz (SF 24.3 Free, englische Oberflaeche) angepasst.
# Nur Spaltennamen der Kopfzeile; Beschreibungsspalten werden beim Einlesen verworfen (Clean-Room, A8).
# Spaltenfolge der Mehrfachspalten: ColumnSql::MultiPaired (HTML hreflang n, HTML hreflang n URL; N09).
key = ["Address"]
drop_sf_columns = ["Description", "How To Fix"]   # Clean-Room: Texte der Referenz nie einlesen

[columns]
"Address" = "Address"
"Title 1" = "Title 1"
"Occurrences" = "Occurrences"
"HTML hreflang 1" = "HTML hreflang 1"
"HTML hreflang 1 URL" = "HTML hreflang 1 URL"
"HTML hreflang 2" = "HTML hreflang 2"
"HTML hreflang 2 URL" = "HTML hreflang 2 URL"
"HTML hreflang 3" = "HTML hreflang 3"
"HTML hreflang 3 URL" = "HTML hreflang 3 URL"
"HTML hreflang 4" = "HTML hreflang 4"
"HTML hreflang 4 URL" = "HTML hreflang 4 URL"
"HTML hreflang 5" = "HTML hreflang 5"
"HTML hreflang 5 URL" = "HTML hreflang 5 URL"
"HTML hreflang 6" = "HTML hreflang 6"
"HTML hreflang 6 URL" = "HTML hreflang 6 URL"
"HTML hreflang 7" = "HTML hreflang 7"
"HTML hreflang 7 URL" = "HTML hreflang 7 URL"
"HTML hreflang 8" = "HTML hreflang 8"
"HTML hreflang 8 URL" = "HTML hreflang 8 URL"
"HTTP hreflang 1" = "HTTP hreflang 1"
"HTTP hreflang 1 URL" = "HTTP hreflang 1 URL"
"HTTP hreflang 2" = "HTTP hreflang 2"
"HTTP hreflang 2 URL" = "HTTP hreflang 2 URL"
"Sitemap hreflang 1" = { ignore = true, reason = "Sitemap-Hreflang: die Referenz (Free) crawlt keine Sitemaps (K-53, SF-FREE)" }
"Sitemap hreflang 1 URL" = { ignore = true, reason = "Sitemap-Hreflang: die Referenz (Free) crawlt keine Sitemaps (K-53, SF-FREE)" }
"Sitemap hreflang 2" = { ignore = true, reason = "Sitemap-Hreflang: die Referenz (Free) crawlt keine Sitemaps (K-53, SF-FREE)" }
"Sitemap hreflang 2 URL" = { ignore = true, reason = "Sitemap-Hreflang: die Referenz (Free) crawlt keine Sitemaps (K-53, SF-FREE)" }
"Indexability" = { ignore = true, reason = "Spaltenliste TECH-071 fuehrt Indexability nicht; die Referenz exportiert sie (Abnahmebericht, Spec-Luecke)" }
"Indexability Status" = { ignore = true, reason = "Spaltenliste TECH-071 fuehrt Indexability Status nicht; die Referenz exportiert sie (Abnahmebericht, Spec-Luecke)" }

[normalize]
base_url = true          # http://127.0.0.1:<port> -> {BASE}, http://localhost:<port> -> {EXT}
trim = true
bool = "case-insensitive"
number_decimals = 3      # Zahlen werden nach Rundung verglichen
empty_equals_null = true
