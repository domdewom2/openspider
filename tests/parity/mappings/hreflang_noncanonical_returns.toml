# N06: Spaltensatz nach Referenzkopfzeile; Soll und Ignoriergründe aus der Spec.
key = ["URL", "Non Canonical Return Link URL", "#"]
drop_ref_columns = ["Description", "How To Fix"]

[columns]
"URL" = "Address"
"Non Canonical Return Link URL" = "Hreflang URL"
"Canonical" = "Canonical Of Hreflang URL"

[normalize]
bool = "case-insensitive"
base_url = true
trim = true
number_decimals = 3
empty_equals_null = true
