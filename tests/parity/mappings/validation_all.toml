# M2-P01: Spec-abgeleitete Spalten; keine Referenzwerte oder Beschreibungstexte.
key = ["Address"]
drop_ref_columns = ["Description", "How To Fix"]

[columns]
"Carbon Rating" = { ignore = true, reason = "SQ-13f / TECH-281: Zusatzspalte der Referenz außerhalb des Validation-Spaltensatzes" }
"CO2 (mg)" = { ignore = true, reason = "SQ-13f / TECH-281: Zusatzspalte der Referenz außerhalb des Validation-Spaltensatzes" }
"Total Transferred (Bytes)" = { ignore = true, reason = "SQ-13f / TECH-281: Zusatzspalte der Referenz außerhalb des Validation-Spaltensatzes" }
"Transferred (Bytes)" = { ignore = true, reason = "SQ-13f / TECH-281: Zusatzspalte der Referenz außerhalb des Validation-Spaltensatzes" }
"Size (Bytes)" = { ignore = true, reason = "SQ-13f / TECH-281: Zusatzspalte der Referenz außerhalb des Validation-Spaltensatzes" }
"Address" = "Address"
"Content Type" = "Content Type"
"Status Code" = "Status Code"
"Status" = "Status"
"Indexability" = "Indexability"
"Indexability Status" = "Indexability Status"

[normalize]
base_url = true
trim = true
bool = "case-insensitive"
number_decimals = 3
empty_equals_null = true
