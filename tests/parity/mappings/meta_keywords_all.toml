# M2-P01: Spec-abgeleitete Spalten; keine Referenzwerte oder Beschreibungstexte.
key = ["Address"]
drop_ref_columns = ["Description", "How To Fix"]

[columns]
"Address" = "Address"
"Occurrences" = "Occurrences"
"Meta Keywords 1" = "Meta Keywords 1"
"Meta Keywords 1 Length" = "Meta Keywords 1 Length"
"Meta Keywords 2" = "Meta Keywords 2"
"Meta Keywords 2 Length" = "Meta Keywords 2 Length"
"Indexability" = "Indexability"
"Indexability Status" = "Indexability Status"

[normalize]
base_url = true
trim = true
bool = "case-insensitive"
number_decimals = 3
empty_equals_null = true
