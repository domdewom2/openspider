# Q02b / OUT-094/095: A/B-Bezug der Referenzspalten anhand der nativen Diff-Proben korrigiert; keine Mengen-/Spaltenausnahme.
# N06: Spaltensatz nach Referenzkopfzeile; Soll und Ignoriergründe aus der Spec.
key = ["URL with Inconsistent Language Return Link", "URL Returning with Inconsistent Language", "#"]
drop_ref_columns = ["Description", "How To Fix"]

[columns]
"URL with Inconsistent Language Return Link" = "Address"
"URL Target" = { ignore = true, reason = "OUT-094: Referenz wiederholt hier die Selbstannotation (identisch mit URL with Inconsistent Language Return Link); Bezugspaar und Expected/Actual Language bleiben verglichen." }
"URL Returning with Inconsistent Language" = "Hreflang URL"
"Expected Language" = "Expected Language"
"Actual Language" = "Actual Language"

[normalize]
bool = "case-insensitive"
base_url = true
trim = true
number_decimals = 3
empty_equals_null = true
