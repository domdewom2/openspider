# Szenario crawl-redirect-chains (CRAWL-017, CRAWL-072): Ketten, Schleifen, gemischte Typen, Host-Wechsel.
# Start mit http://site.test/ (other.test ist extern).

[[route]]
path = "/a"
status = 301
location = "/b"

[[route]]
path = "/b"
status = 301
location = "/c"

[[route]]
path = "/c"
status = 301
location = "/d"

[[route]]
path = "/d"
