# Szenario "crawl-cookies" (CRAWL-088): /set setzt ein Cookie und leitet auf /check weiter.
#
# /check, /check2 und /secure-only zeigen die empfangenen Header und Cookies als JSON (Echo);
# /secure-only setzt außerdem ein Secure-Cookie.

[[route]]
path = "/set"
status = 302
location = "/check"
[route.headers]
Set-Cookie = "sid=abc123; Path=/"

[[route]]
path = "/check"
echo = "headers"

[[route]]
path = "/check2"
echo = "headers"

[[route]]
path = "/secure-only"
echo = "headers"
set_cookie = "tls=geheim; Secure; Path=/"
