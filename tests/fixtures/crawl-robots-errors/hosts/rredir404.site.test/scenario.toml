# robots.txt -> 301 -> 404: wie 404 (CRAWL-100)
[[route]]
path = "/robots.txt"
status = 301
location = "/gone"

[[route]]
path = "/gone"
status = 404
body = "Not Found"
content_type = "text/plain"

[[route]]
path = "/seite"
body = "<!doctype html><html><head><title>seite</title></head><body><h1>seite</h1></body></html>"
