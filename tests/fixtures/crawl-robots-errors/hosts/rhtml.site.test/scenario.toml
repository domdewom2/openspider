# Soft-404: 200 text/html statt robots.txt -> keine gueltigen Regeln, alles erlaubt (CRAWL-100)
[[route]]
path = "/robots.txt"
status = 200
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html><head><title>Seite nicht gefunden</title></head><body><h1>Seite nicht gefunden</h1><p>Disallow bedeutet hier nichts</p></body></html>"

[[route]]
path = "/seite"
body = "<!doctype html><html><head><title>seite</title></head><body><h1>seite</h1></body></html>"
