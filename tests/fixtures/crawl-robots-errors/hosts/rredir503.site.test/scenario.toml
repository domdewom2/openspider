# robots.txt -> 301 -> 503: wie 503, Policy greift (CRAWL-100)
[[route]]
path = "/robots.txt"
status = 301
location = "/unavailable"

[[route]]
path = "/unavailable"
status = 503
body = "Service Unavailable"
content_type = "text/plain"

[[route]]
path = "/seite"
body = "<!doctype html><html><head><title>seite</title></head><body><h1>seite</h1></body></html>"
