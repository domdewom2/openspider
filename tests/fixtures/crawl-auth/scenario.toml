# Szenario "crawl-auth" (CRAWL-117).
#
# Virtueller Host basic.site.test: "/" zeigt die empfangenen Header (JSON-Echo), damit ein Test sieht, ob
# und mit welchem Authorization-Header der Abruf ankam (Benutzer prüfer/geheim, UTF-8). Der Testserver
# erzwingt selbst keine Anmeldung. /to-other leitet auf other.test/echo-headers weiter, das ebenfalls
# die empfangenen Header zurückgibt.

[[route]]
path = "/to-other"
status = 302
location = "http://other.test/echo-headers"

[[route]]
path = "/"
host = "basic.site.test"
echo = "headers"

[[route]]
path = "/echo-headers"
host = "other.test"
echo = "headers"
