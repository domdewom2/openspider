# Szenario "crawl-no-response" (CRAWL-013, ONPAGE-065).
# /hang-response antwortet erst nach zwei Minuten (praktisch nie); /timeout nach 30 s.
#
# Nicht über den Testserver, sondern über den Test selbst: nicht auflösbarer Host (nicht-existent.invalid),
# geschlossener Port, TLS gegen einen Klartext-Port (siehe tests/http_fetch.rs).
#
# /reset-mid-body (halber Body, dann TCP-Reset) und /drop (nur der Kopf, dann Verbindung zu);
# https://expired.site.test/ hat ein abgelaufenes Zertifikat (macht der Testserver per SNI selbst).
#
# Entscheidung K-24: Die Route /hang-connect (Blackhole-Port für einen hängenden TCP-Aufbau) entfällt.
# Ein deterministisches Verhalten gibt es nicht plattformübergreifend (Begründung: Abschnitt „Nicht
# enthalten“ in crates/os-testsite/src/lib.rs). Die Spec-Fixture (01-crawl.md, CRAWL-013) ist
# entsprechend angepasst. „TCP-Aufbau hängt“ wird über die Klassifikation und die Berechnung des
# Verbindungs-Timeouts geprüft (crates/os-fetch/tests/http_fetch.rs, Mini-Server und simulierte Zeit).

[[route]]
path = "/hang-response"
delay_ms = 120000
body = "<html><body>zu spät</body></html>"

[[route]]
path = "/timeout"
delay_ms = 30000
body = "<html><body>zu spät</body></html>"

[[route]]
path = "/reset-mid-body"
reset_mid_body = true
body_size = 4096

[[route]]
path = "/drop"
abort_after_headers = true
body_size = 4096
