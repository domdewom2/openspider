# Szenario onpage-rc (ONPAGE-050 … 063, CRAWL-012): Statusklassen, Weiterleitungen, Ketten, Schleifen, robots.txt.
# Start: http://site.test/ (intern); other.test ist extern (ein Fixture-Server, der Host-Header entscheidet).
# Die Hosts nohost.invalid (DNS-Fehler) und 127.0.0.1:1 (Verbindung abgelehnt) sind externe Links der Startseite.
# /timeout antwortet nach 3 s: Tests setzen advanced.response_timeout_s = 1.
# /blocked/a ist durch robots.txt (Disallow: /blocked/) gesperrt; /flaky liefert erst 503, dann 200 (nur
# über flaky-start.html erreichbar, Retry-Kriterium ONPAGE-063 ist M2).
# Pfad-Routen ignorieren die Query: /qloop leitet auf /qloop?x=1 weiter, das wieder dieselbe Route trifft.

[[route]]
path = "/ok"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html><head><meta charset=\"utf-8\"><title>ok</title></head><body><h1>ok</h1></body></html>"

[[route]]
path = "/r301"
status = 301
location = "/ok"

[[route]]
path = "/r302"
status = 302
location = "/ok"

[[route]]
path = "/r307"
status = 307
location = "/ok"

[[route]]
path = "/r308"
status = 308
location = "/ok"

[[route]]
path = "/r304"
status = 304

[[route]]
