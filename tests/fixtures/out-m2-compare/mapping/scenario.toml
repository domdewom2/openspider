# Szenario "out-m2-compare/mapping" (OUT-146, CRAWL-034, TECH-306, OUT-151): zwei Hosts gleicher Struktur.
# staging.site.test mit Trailing Slashes (Verzeichnisse), www.site.test ohne (Routen). /dup und /dup/ auf Staging
# erzeugen die Kollision aus OUT-146. Start: http://staging.site.test/ bzw. http://www.site.test/.

[[route]]
path = "/dup"
host = "staging.site.test"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><title>Doppel</title></head><body><main><h1>Doppel</h1></main></body></html>"

[[route]]
path = "/a"
host = "www.site.test"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><title>Seite A</title></head><body><main><h1>Seite A</h1></main></body></html>"

[[route]]
path = "/b"
host = "www.site.test"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><title>Seite B</title></head><body><main><h1>Seite B</h1></main></body></html>"

[[route]]
path = "/shop/a"
host = "www.site.test"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><title>Shop A</title></head><body><main><h1>Shop A</h1></main></body></html>"

[[route]]
path = "/blog/b"
host = "www.site.test"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><title>Blog B</title></head><body><main><h1>Blog B</h1></main></body></html>"

[[route]]
path = "/dup"
host = "www.site.test"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html lang=\"de\"><head><meta charset=\"utf-8\"><title>Doppel</title></head><body><main><h1>Doppel</h1></main></body></html>"
