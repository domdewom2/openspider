body = "<!doctype html><html><head><meta charset=\"utf-8\"><title>Privat</title></head><body><h1>Privat</h1></body></html>"

[[route]]
path = "/z%C3%AFel"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html><head><meta charset=\"utf-8\"><title>Zïel</title></head><body><h1>Zïel</h1></body></html>"

[[route]]
path = "/body-link"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html><head><meta charset=\"utf-8\"><title>Body-Link</title></head><body><h1>Body-Link</h1></body></html>"

