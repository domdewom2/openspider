# Szenario "out-basic-site" (Port 8900) - erzeugt von tests/parity/gen/generate.py,
# nicht von Hand bearbeiten (Aenderungen im Generator vornehmen und neu erzeugen).

[[route]]
path = "/missing.html"
status = 404
body = "<!doctype html><html><head><title>Not Found</title></head><body><h1>404</h1></body></html>"

[[route]]
path = "/old-page"
status = 301
location = "/about.html"

