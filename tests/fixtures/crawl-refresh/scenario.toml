# Szenario crawl-refresh (CRAWL-015): Meta- und HTTP-Refresh.

[[route]]
path = "/meta0"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html><head><meta charset=\"utf-8\"><title>meta0</title><meta http-equiv=\"refresh\" content=\"0;url=/ziel1\"></head><body><h1>meta0</h1></body></html>"

