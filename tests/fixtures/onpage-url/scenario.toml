# Szenario onpage-url (ONPAGE-070 … 081): URL-Varianten der Startseite; jede Route liefert 200 HTML.
# Start: http://site.test/ (intern). /Nicht_Da hat keine Route (404). Pfad-Routen ignorieren die Query.
# Pfade mit exakt 39/40 Zeichen Länge nach dem Slash (/aaa…, /bbb…) und 98/99 (/ddd…, /ccc…) für die
# Längenfilter: Adresse = "http://site.test" (16 Zeichen) + Pfad, also 56, 57, 115 und 116 Zeichen.

[[route]]
path = "/über-uns"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html><head><meta charset=\"utf-8\"><title>/über-uns</title></head><body><h1>/über-uns</h1></body></html>"

