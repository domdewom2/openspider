# Szenario tech/url-compare (TECH-002): Canonical-Varianten; Golden prueft aufgeloeste Werte und Self-/Canonicalised.
# Schema-Variante ueber Grossbuchstaben (HTTP://), Fragment, Trailing Slash, leerer href, kaputte URL, <base>.

[[route]]
path = "/u/trailing-slash.html/"
content_type = "text/html; charset=utf-8"
body = "<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<title>trailing-slash</title>\n<link rel=\"canonical\" href=\"/u/trailing-slash.html/\">\n</head>\n<body>\n<h1>trailing-slash</h1>\n</body>\n</html>\n"

[[route]]
path = "/other/base.html"
content_type = "text/html; charset=utf-8"
body = "<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<title>other/base.html</title>\n<link rel=\"canonical\" href=\"/other/base.html\">\n</head>\n<body>\n<h1>other/base.html</h1>\n</body>\n</html>\n"
