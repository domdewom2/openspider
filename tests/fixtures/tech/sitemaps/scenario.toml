status = 410
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><title>Gone</title></head><body><h1>Gone</h1></body></html>"

[[route]]
path = "/sitemap-posts.xml.gz"
content_type = "application/gzip"
