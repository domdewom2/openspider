# Szenario "crawl-status-codes" (CRAWL-012): Route /code/{n} liefert den Statuscode n.
# 3xx (außer 304) leiten auf /code/200 weiter; 204 und 304 haben keinen Body.
#
# 103 Early Hints kann der Testserver nicht senden (keine Zwischenantworten); das Überspringen von 1xx
# prüft tests/http_fetch.rs (informational_responses_are_skipped) gegen einen eigenen Mini-Server.

[[route]]
path = "/code/200"
status = 200
body = "<html><head><title>Status 200</title></head><body>Status 200</body></html>"

