# Szenario out-queue (OUT-030, OUT-184, CRAWL-126): Startseite mit 20 Links /q1.html … /q20.html.
# Jede Unterseite antwortet mit 400 ms Verzögerung; mit --max-urls bleibt eine Restwarteschlange, per SIGINT
# lässt sich der Crawl mitten im Lauf pausieren.

[[route]]
path = "/q1.html"
delay_ms = 400

