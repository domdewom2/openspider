# Szenario crawl-include-exclude (CRAWL-109/110). / verlinkt alle Faelle; /blog/a bindet ein Bild ein.
# blog.site.test wird per network.resolve (*.test) auf diese Site abgebildet und ist fuer eine Start-URL auf
# 127.0.0.1 extern. Pfade mit Leerzeichen/Umlaut: Routen vergleichen auch gegen den dekodierten Pfad.

[[route]]
path = "/blog/a"
body = "<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<title>/blog/a</title>\n</head>\n<body>\n<h1>/blog/a</h1>\n<p><img src=\"/img/a.png\" alt=\"A\"></p>\n</body>\n</html>\n"

[[route]]
path = "/img/a.png"
png_size = 200

