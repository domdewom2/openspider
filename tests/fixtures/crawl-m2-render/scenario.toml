[[route]]
path = "/robots.txt"
content_type = "text/plain"
body = "User-agent: *\nDisallow: /blocked.js\n"

[[route]]
path = "/"
content_type = "text/html"
body = '''<!doctype html><html><head><link rel="icon" href="data:,"><title>Raw</title><meta name="robots" content="noindex"></head><body><p id="removed">Removed-Marker</p><a href="/both">both</a><a id="raw" href="/raw">raw</a><img id="lazy" data-src="/lazy.png"><script>
document.title='Rendered';
document.querySelector('[name=robots]').remove();
document.querySelector('#removed').remove();
document.querySelector('#raw').remove();
document.querySelector('#lazy').src='/lazy.png';
document.head.insertAdjacentHTML('beforeend','<link rel="canonical" href="/canonical">');
document.body.insertAdjacentHTML('beforeend','<h1>DOM heading</h1><p id="late">Injected-Marker</p><a href="/js-only">JS only</a><a href="/js-only">twice</a><a href="http://external.test/out">external</a>');
const blocked=document.createElement('script'); blocked.src='/blocked.js'; document.head.append(blocked);
document.cookie='js_session=active; Path=/';
document.body.dataset.visibleCookies=document.cookie;
console.error('fixture-js-error');
</script></body></html>'''

[route.headers]
Set-Cookie = "http_secret=only-http; Path=/; HttpOnly"

[[route]]
path = "/lazy.png"
png_size = 20000

[[route]]
path = "/both"
body = "both"
[[route]]
path = "/raw"
body = "raw"
[[route]]
path = "/js-only"
body = "js"
[[route]]
path = "/canonical"
body = "canonical"
[[route]]
path = "/out"
body = "external"
[[route]]
path = "/blocked.js"
content_type = "application/javascript"
body = "console.error('must not load')"

[[route]]
path = "/redirect"
content_type = "text/html"
body = "<script>location.replace('/js-only')</script>"
[[route]]
path = "/pushstate"
content_type = "text/html"
body = "<script>history.pushState({},'', '/js-only')</script><h1>same document</h1>"
[[route]]
path = "/late"
content_type = "text/html"
body = "<script>setTimeout(()=>location.href='/js-only',10000)</script>"
[[route]]
path = "/fragment"
content_type = "text/html"
body = "<a href='/fragment#a'>a</a><a href='/fragment#b'>b</a><script>document.title=location.hash||'none'</script>"

[[route]]
path = "/meta-redirect"
content_type = "text/html"
body = "<meta http-equiv='refresh' content='0;url=/js-only'>"

[[route]]
path = "/private/page"
content_type = "text/html"
body = "<script>(async()=>{const r=await fetch('/private/challenge'); document.title=r.status===200?'private-authorized':'private-failed'; await fetch('/public/challenge');})()</script>"

[[route]]
path = "/private/challenge"
sequence = [401, 200]
[route.headers]
WWW-Authenticate = 'Basic realm="fixture"'

[[route]]
path = "/public/challenge"
status = 401
[route.headers]
WWW-Authenticate = 'Basic realm="fixture"'

[[route]]
path = "/login"
content_type = "text/html"
set_cookie = ["login=authenticated; Path=/; HttpOnly", "delete_me=old; Path=/"]
body = "<a href='/login-next'>next</a><script>(async()=>{document.cookie='browser_js=active; Path=/'; await fetch('/login-resource'); await fetch('/cookie-delete'); document.title='login-ready';})()</script>"

[[route]]
path = "/login-resource"
set_cookie = "browser_http=active; Path=/; HttpOnly"
body = "login-resource"

[[route]]
path = "/cookie-delete"
set_cookie = "delete_me=; Path=/; Max-Age=0"
body = "deleted"

[[route]]
path = "/login-next"
content_type = "text/html"
body = "<script>fetch('/login-check').then(()=>document.title='checked');</script>"

[[route]]
path = "/login-check"
echo = "headers"

[[route]]
path = "/language"
content_type = "text/html"
body = "<script>document.title=JSON.stringify([navigator.language,navigator.languages,new Intl.DateTimeFormat().resolvedOptions().locale]); fetch('/language-check')</script>"

[[route]]
path = "/language-check"
echo = "headers"

[[route]]
path = "/analytics"
content_type = "text/html"
body = "<script>for (const host of ['google-analytics.com','www.google-analytics.com','googletagmanager.com','analytics.google.com','notgoogle-analytics.com']) { const s=document.createElement('script'); s.src='http://'+host+':'+location.port+'/analytics.js'; document.head.append(s); }</script>"

[[route]]
path = "/analytics.js"
content_type = "application/javascript"
body = "document.title='analytics-loaded'; document.cookie='analytics=active; Path=/';"
