# Szenario out-redirects (OUT-081, OUT-082, OUT-085): einfache und lange Ketten, Schleifen, 404-Ziel,
# Meta-/HTTP-Refresh, 308, gemischte Kette und Host-Wechsel. Start: http://site.test/ mit
# scope.all_subdomains = true (www.site.test ist dann intern). Zwischenglieder, die nur über Ketten erreicht
# werden (/d, /g, /l2 ...), sind absichtlich nicht verlinkt; /x2 ist es.

[[route]]
path = "/a"
status = 301
location = "/b"

[[route]]
path = "/b"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html><head><meta charset=\"utf-8\"><title>Ziel b</title></head><body><h1>Ziel b</h1></body></html>"

