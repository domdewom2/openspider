# Szenario crawl-canonicals (CRAWL-046). Jedes *-Ziel ist nur ueber den Canonical der jeweiligen Seite erreichbar.
# /variante und /variante?farbe=rot liefern dasselbe Dokument (Routen kennen keine Query): canonical -> /variante.

[[route]]
path = "/c1"
body = "<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<title>c1</title>\n<link rel=\"canonical\" href=\"/nur-canonical\">\n</head>\n<body>\n<h1>c1</h1>\n</body>\n</html>\n"

[[route]]
path = "/c2"
body = "<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<title>c2</title>\n</head>\n<body>\n<h1>c2</h1>\n</body>\n</html>\n"
[route.headers]
Link = "</nur-header-canonical>; rel=\"canonical\""

[[route]]
path = "/c3"
body = "<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<title>c3</title>\n<link rel=\"canonical\" href=\"/nur-canonical-a\">\n<link rel=\"canonical\" href=\"/nur-canonical-b\">\n</head>\n<body>\n<h1>c3</h1>\n</body>\n</html>\n"

