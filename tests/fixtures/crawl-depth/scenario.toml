# Szenario crawl-depth (CRAWL-005, CRAWL-067): Kette / → /1 → … → /10, Direktlink / → /7,
# /sitemap.xml mit /nur-sitemap (nur über die Sitemap erreichbar). /2 bindet /style.css ein, /3 ein Bild.

[[route]]
path = "/1"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html><head><meta charset=\"utf-8\"><title>Seite 1</title></head><body><h1>Seite 1</h1><a href=\"/2\">weiter 2</a></body></html>"

[[route]]
path = "/2"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html><head><meta charset=\"utf-8\"><title>Seite 2</title><link rel=\"stylesheet\" href=\"/style.css\"></head><body><h1>Seite 2</h1><a href=\"/3\">weiter 3</a></body></html>"

[[route]]
path = "/3"
content_type = "text/html; charset=utf-8"
body = "<!doctype html><html><head><meta charset=\"utf-8\"><title>Seite 3</title></head><body><h1>Seite 3</h1><a href=\"/4\">weiter 4</a><img src=\"/img/b3.png\" alt=\"Bild 3\"></body></html>"

