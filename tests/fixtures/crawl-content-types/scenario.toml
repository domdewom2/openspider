# Szenario "crawl-content-types" (CRAWL-019, ONPAGE-020): je eine Route pro MIME-Typ der Klassentabelle.
# /falscher-ct liefert text/plain mit HTML-Body, /HTML-upper den Wert "Text/HTML; Charset=UTF-8".
#
# /kein-ct liefert einen HTML-Body ganz ohne Content-Type-Header.

[[route]]
path = "/t-html"
content_type = "text/html"
body = "<html><body>Inhalt von t-html</body></html>"

