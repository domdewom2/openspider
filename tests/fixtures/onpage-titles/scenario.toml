# Szenario onpage-titles (ONPAGE-002, -009, -090 ... -094, -098; CRAWL-089). Erzeugt, nicht von Hand bearbeiten.
# /gone: 404 mit HTML-Body und Titel (gehoert nicht in die Grundmenge, ONPAGE-009).
# /moved: Weiterleitung auf eine Seite der Grundmenge.
# doc.pdf: Dokumenttitel "Preisliste 2026", Keywords "preise, liste" (A-5b: nur im Internal-Tab).

[[route]]
path = "/gone"
status = 404
body = "<!doctype html>\n<html><head><meta charset=\"utf-8\"><title>Gone Seite mit Titel im Fehlerfall</title></head><body><h1>Gone</h1></body></html>\n"

[[route]]
path = "/moved"
status = 301
location = "/len-60.html"

[[route]]
path = "/doc.pdf"
content_type = "application/pdf"
