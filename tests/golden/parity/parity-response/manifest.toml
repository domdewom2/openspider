# Paritaets-Golden fuer "parity-response": Metadaten und Exportliste (Format: docs/plan/M1.md 5.2).
# Vom Nutzer auszufuellen: ref_version, exported_at, je Export status (pending -> present | unavailable) und ggf. ref_file.
# Die Roh-Exporte der Referenz liegen unveraendert in ref/ (siehe ../README.md); Agents legen dort nichts an.
site = "parity-response"
port = 8904                       # Port beim Referenzexport (wird beim Vergleich zu {BASE} normalisiert)
ref_version = "referenz-2026-10"
exported_at = "2026-10-14"
ref_settings = "Referenzprodukt (Free-Version) (macOS arm64), Oberflächensprache für den Export auf English (UK) gestellt (Spaltennamen englisch), sonst Standardkonfiguration. In der Free-Version ist die Spider-Konfiguration gesperrt; daher galten die Standards: Hreflang speichern=an/crawlen=aus, Pagination speichern=an/crawlen=aus, verlinkte XML-Sitemaps crawlen=aus, XML-Sitemaps über robots.txt automatisch erkennen=an (Crawl aber aus), robots.txt respektieren, kein JS-Rendering. Crawl-Analyse wurde nach jedem Crawl ausgeführt. Exportiert per Bildschirmsteuerung durch den Orchestrator am 2026-10-14."

[[export]]
ref_file = "internal_all.csv"
os = "tab:Internal:All"
mapping = "internal_all"
status = "present"               # pending | present | unavailable

[[export]]
ref_file = "external_all.csv"
os = "tab:External:All"
mapping = "external_all"
status = "present"               # pending | present | unavailable

