# Paritaets-Golden fuer "parity-onpage": Metadaten und Exportliste (Format: docs/plan/M1.md 5.2).
# Vom Nutzer auszufuellen: ref_version, exported_at, je Export status (pending -> present | unavailable) und ggf. ref_file.
# Die Roh-Exporte der Referenz liegen unveraendert in ref/ (siehe ../README.md); Agents legen dort nichts an.
site = "parity-onpage"
port = 8902                       # Port beim Referenzexport (wird beim Vergleich zu {BASE} normalisiert)
ref_version = "24.3"
exported_at = "2026-10-14"
ref_settings = "Referenzprodukt Free 24.3 (macOS arm64), Oberflächensprache für den Export auf English (UK) gestellt (Spaltennamen englisch), sonst Standardkonfiguration. In der Free-Version ist die Spider-Konfiguration gesperrt; daher galten die Standards: Hreflang speichern=an/crawlen=aus, Pagination speichern=an/crawlen=aus, verlinkte XML-Sitemaps crawlen=aus, XML-Sitemaps über robots.txt automatisch erkennen=an (Crawl aber aus), robots.txt respektieren, kein JS-Rendering. Crawl-Analyse wurde nach jedem Crawl ausgeführt. Exportiert per Bildschirmsteuerung durch den Orchestrator am 2026-10-14."

