[package]
name = "openspider-desktop"
description = "OpenSpider Desktop (Tauri v2)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "openspider_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Opt-in synthetic grid measurement (M2-S01).
stub-views = ["os-app/stub-views"]
# WebDriver-Server der echten App für E2E-B (tauri-plugin-wdio-webdriver, M2-S02); nie in Release-Builds
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# M2-F01 (docs/plan/M2.md 3.1/3.7): Plugins der Hülle; die Registrierung und die Capabilities setzt M2-F03
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
# os-app ist die einzige Verbindung zum Kern; Tauri kommt nirgends sonst vor (3.2)
os-model.workspace = true
os-app.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
