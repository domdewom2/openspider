# Zuordnung Autonomo-rule_id <-> OpenSpider-Tab:Filter (M2-V02, Etappe E1).
# Nur Kennungen und eigene Kurzbegründungen, keine Texte aus Autonomo oder aus Unterlagen zum Referenzprodukt.
# Die OpenSpider-Kennungen müssen in docs/plan/M1-filters.toml (bzw. M2-filters.toml) stehen:
#   python3 scripts/shadow/compare.py validate --rule-map scripts/shadow/rule-map.toml \
#       --filters docs/plan/M1-filters.toml docs/plan/M2-filters.toml
#
# STAND: Die [[rule]]-Einträge sind noch leer. Die rule_id-Kennungen von Autonomo sind nur auf dem VPS
# lesbar (Befundtabelle bzw. /api/extern) und wurden bei der Erstellung nicht eingesehen; erfunden werden sie
# nicht. Sie werden nach dem ersten lesenden Zugriff ergänzt (docs/plan/shadow/E1-runbook.md, Schritt 6).
# Bis dahin exportiert der Schattenlauf alle unter [export] genannten Filter, und compare.py führt jede
# Autonomo-Regel unter "ohne Zuordnung" auf.
#
# Eintragsformat:
#
#   [[rule]]
#   autonomo   = "<rule_id>"                     # Kennung aus Autonomo, genau einmal
#   openspider = ["Tab:Filter", ...]              # leer nur bei class = "ohne Gegenstück"
#   class      = "gleichwertig"                   # gleichwertig | teilweise | ohne Gegenstück
#   reason     = "eigene kurze Begründung"       # je Eintrag verschieden

schema = 1

[export]
# Immer exportiert: Zählbasis für alle Vergleiche.
base = [
  "Internal:All",
  "Internal:HTML",
]
# Alle Befund-Filter (issue = true in docs/plan/M1-filters.toml), damit der Sofortlauf unabhängig vom Stand der
# Zuordnung vollständige Daten liefert. Zugeordnete Filter aus [[rule]] kommen automatisch dazu.
extra = [
  "Security:HTTP URLs",
  "Response Codes:Internal Blocked by Robots.txt",
  "Response Codes:Internal No Response",
