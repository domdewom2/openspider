# Kanonische Filter-Kennungen M2 (Anhang A zu docs/plan/M2.md) – ergänzt docs/plan/M1-filters.toml
#
# Maßgeblich für:
#   M2-F02   Registrierung aller Tabs/Filter in tabs::all() als Stubs (Prädikat "0" bzw. Population), Issue-Katalog je Tab,
#            CI-Test filters_registry.rs (M1- und M2-Datei gemeinsam), Abgleich Katalog ↔ Register
#   Fachpakete (Spalte package bzw. pkg am Filter) übernehmen FilterDef.id exakt; keine eigenen Schreibweisen
#   M2-K02/K06, M2-M01, os-export: Namensauflösung "Tab:Filter" case-insensitiv (K-08)
#
# Änderungen nur über den Orchestrator bzw. Planer (Rückmeldung „Schnittstellenbedarf“). Einzige Ausnahme: M2-F02 setzt
# die Felder issue/requires nach UI-064 bzw. Spec, wo hier „Planannahme“ steht, und begründet jede Änderung im Commit.
#
# Regeln wie M1-filters.toml:
#   - Schreibweise nach 02/03/04; Anzeige mit Platzhaltern {config.pfad} für Schwellen (ONPAGE-002).
#   - Reihenfolge der neuen Tabs = UI-004; neue Filter bestehender Tabs werden hinter die M1-Filter gehängt, außer die Spec
#     legt eine andere Anzeigereihenfolge fest (dann gilt die Spec; M2-F02 ordnet).
#   - kind: "live" | "post_crawl:<Teilschritt>" (abschließende Liste TECH-005; ONPAGE-144 Teilschritt NearDuplicates).
#   - issue = true: Befund-Filter laut UI-064 (Typ/Priorität dort); hier automatisch abgeglichen, Groß-/Kleinschreibung egal.
#   - requires: Konfigurationsschalter bzw. Bedingungen (Zustand NeedsConfig/NeedsRendering, ONPAGE-007, UI-016).
#   - extension = true: [OS-Erweiterung], im Paritätsprofil ausgeblendet.
#   - <…> in spitzen Klammern: dynamische Filter (je Suchfilter/Extraktor/Snippet/axe-Regel), Kennung zur Laufzeit.
#   - M4/M5-Tabs (AI, AI Decisions, AI Suggestions, AI Search, Organic Keywords, Rankings, LLM Mentions) und AMP (P2) fehlen
#     bewusst; die UI kennt keine Tab-Liste im Code (M2-ui-concept 1.3).

schema = 1
