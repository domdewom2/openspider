# Kanonische Filter-Kennungen M1 (Anhang A zu docs/plan/M1.md)
#
# Maßgeblich für:
#   M1-P00b  tabs::all()-Platzhalter (je Tab eine TabDef mit genau diesen FilterDef.id, Prädikat "0" bzw. Population)
#   M1-P12   Issue-Katalog: jede Katalog-ID (tab + filter) MUSS hier stehen; jeder Eintrag mit issue = true MUSS im Katalog stehen
#   M1-P14   Namensauflösung "Tab:Filter" (case-insensitiv, K-08)
#   M1-P20…P25 FilterDef.id exakt so übernehmen (keine eigenen Schreibweisen)
#   M1-P16/P17/P26/P27 Export-, Report-, CLI- und MCP-Namen
#
# Änderungen nur über den Orchestrator (Rückmeldung „Schnittstellenbedarf“), nie in einem Paket-Worktree.
#
# Regeln:
#   - Schreibweise nach 02/03 (K-08): Anzeige und Export „Client Error (4XX)“; Namensvergleich case-insensitiv.
#   - Schwellen als Platzhalter {config.pfad}; die Anzeige ersetzt sie durch den aktuellen Wert (ONPAGE-002).
#     default_label = Anzeige mit Standardwerten aus M1.md 3.4.
#   - Reihenfolge der Tabs = UI-Reihenfolge (tabs::all()); Reihenfolge der Filter = Anzeige-Reihenfolge.
#   - kind: "live" (während/nach dem Crawl per SQL) | "post_crawl:<AnalysisStep>" (Nachlauf, CRAWL-141/TECH-005).
#   - issue = true: Befund-Filter mit Eintrag im Issue-Katalog (UI-064, Kategorien Response Codes … Links, Sitemaps).
#   - requires: Konfigurationsschlüssel, die true sein müssen (sonst Zustand NeedsConfig, ONPAGE-007).
#   - Nicht in M1 (P1/P2, siehe M1.md 7.2) und daher hier NICHT aufgeführt, z. B. Internal Flash/Other,
#     Response Codes Blocked Resource/Redirection (JavaScript)/Redirection (HTTP Refresh), Pixel-Filter,
#     Outside <head>, Meta Keywords. Die zugehörigen OUT-050-Exporte liefern nur die Kopfzeile (K-14).

schema = 1

[[tab]]
id = "Internal"
module = "internal"
package = "M1-P20"
filters = [
  { id = "All", spec = "ONPAGE-001", kind = "live" },
  { id = "HTML", spec = "ONPAGE-021", kind = "live" },
  { id = "JavaScript", spec = "ONPAGE-022", kind = "live" },
  { id = "CSS", spec = "ONPAGE-022", kind = "live" },
