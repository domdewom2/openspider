# Response Codes: jede Statusklasse in drei Sichten (ONPAGE-051): ohne Präfix = intern + extern,
# „Internal …“, „External …“; Vereinigung disjunkt. „Internal All“/„External All“ sind die Sicht-Grundmengen
# (OS-Festlegung für die Namensauflösung, z. B. `Response Codes:Internal All`).
# „Other“ = Codes außerhalb 100–599 (CRAWL-012, OS-Erweiterung), nur sichtbar bei Treffern.
[[tab]]
