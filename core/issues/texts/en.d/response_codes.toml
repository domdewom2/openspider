[issues.response-codes-internal-redirection-http-refresh]
what = "The response header sends visitors to another URL using Refresh."
why = "A delayed navigation adds waiting time and can be handled differently by crawlers. Links to this address require an additional navigation."
fix = "Link directly to the destination. If the move is permanent, replace the Refresh header with an appropriate HTTP redirect."
