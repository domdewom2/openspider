
[issues.javascript-pages-with-blocked-resources]
what = "Rendering was prevented from loading resources by robots.txt."
why = "Blocked resources may hide content or alter the rendered page."
fix = "Review robots.txt rules for the listed resources and allow those needed for rendering."

[issues.javascript-contains-javascript-links]
what = "Some hyperlinks appear only in the rendered document."
why = "Discovering their destinations requires JavaScript execution."
fix = "Provide important navigation as ordinary links in the delivered HTML."

[issues.javascript-contains-javascript-content]
what = "The rendered document contains more words than the original HTML."
why = "Access to this additional content depends on rendering."
fix = "Deliver important text in the original HTML and verify the rendered result."

[issues.javascript-noindex-only-in-original-html]
what = "The original HTML contains noindex, but the rendered document removes it."
why = "The original restriction remains effective despite the script change."
fix = "Set the intended robots directives in the delivered HTML."

[issues.javascript-nofollow-only-in-original-html]
what = "The original HTML contains nofollow, but the rendered document removes it."
why = "The original restriction remains effective despite the script change."
fix = "Set the intended robots directives in the delivered HTML."

[issues.javascript-canonical-only-in-rendered-html]
what = "An HTML canonical is added during rendering."
why = "Canonical discovery depends on JavaScript execution."
fix = "Include the canonical link in the delivered HTML head."

[issues.javascript-canonical-mismatch]
what = "Original and rendered HTML specify different canonical URLs."
why = "Conflicting hints can lead to an unintended canonical selection."
fix = "Use the same intended canonical URL in both versions."

