[issues.javascript-canonical-only-in-rendered-html]
what = "Ein HTML-Canonical wird erst beim Rendern ergänzt."
why = "Die Erkennung des Canonicals hängt von JavaScript ab."
fix = "Ergänze den Canonical-Link im Head des ausgelieferten HTML."

[issues.javascript-canonical-mismatch]
what = "Original und gerendertes HTML nennen verschiedene Canonical-URLs."
why = "Widersprüchliche Hinweise können zur falschen kanonischen Auswahl führen."
fix = "Verwende in beiden Fassungen dieselbe beabsichtigte Canonical-URL."

[issues.javascript-page-title-only-in-rendered-html]
what = "Page Title wird durch JavaScript ergänzt oder geändert."
why = "Suchmaschinen müssen die Seite für den endgültigen Wert rendern."
fix = "Liefere den beabsichtigten Wert im Original-HTML und halte beide Fassungen konsistent."

