
[issues.javascript-pages-with-blocked-resources]
what = "Beim Rendern wurden Ressourcen durch robots.txt gesperrt."
why = "Gesperrte Ressourcen können Inhalte verbergen oder die Darstellung verändern."
fix = "Prüfe die robots.txt-Regeln und erlaube die für das Rendern benötigten Ressourcen."

[issues.javascript-contains-javascript-links]
what = "Einige Hyperlinks erscheinen erst im gerenderten Dokument."
why = "Ihre Ziele lassen sich erst nach der JavaScript-Ausführung entdecken."
fix = "Stelle wichtige Navigationslinks bereits im ausgelieferten HTML bereit."

[issues.javascript-contains-javascript-content]
what = "Das gerenderte Dokument enthält mehr Wörter als das Original."
why = "Zusätzliche Inhalte hängen vom erfolgreichen Rendern ab."
fix = "Liefere wichtige Texte im Original-HTML und prüfe das gerenderte Ergebnis."

[issues.javascript-noindex-only-in-original-html]
what = "Das Original enthält noindex, im gerenderten Dokument fehlt die Direktive."
why = "Die Einschränkung des Originals bleibt trotz der Skriptänderung wirksam."
fix = "Setze die beabsichtigten Robots-Direktiven im ausgelieferten HTML."

[issues.javascript-nofollow-only-in-original-html]
