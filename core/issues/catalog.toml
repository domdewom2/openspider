# OpenSpider – Issue-Katalog (UI-063/UI-064), einzige Klassifizierungsdatei.
#
# Klassifizierung abgeleitet aus öffentlicher Dokumentation der Referenz (Benchmark), begründet nach UI-063.
#
# Maßgeblich ist die Herleitung nach UI-063 (type_rule T-*, priority_rule P-*). Weicht der Benchmark aus UI-064
# von dieser Herleitung ab, steht der Benchmark-Wert in type/priority und der Eintrag trägt override_reason
# (benchmark-parity). Tab und Filter folgen exakt docs/plan/M1-filters.toml (Schwellen als {config.pfad}).
# text_params ordnet Platzhalter der Texte ({max}, {min}, {unit}, {threshold}) einem Konfigurationspfad zu.
# Texte: core/issues/texts/{de,en}.toml (Schlüssel issues.<id>.what|why|fix); Doku: docs/issues/<doc_key>.md.

schema = 1

