# OpenSpider – Issue-Katalog ab M2, Tab „Search Console“ (UI-063/UI-064).
#
# Einträge wie in core/issues/catalog.toml (`[[issue]]` mit id, tab, filter, type, priority, type_rule, priority_rule,
# doc_key, optional override_reason/needs_crawl_analysis/text_params); `tab` ist hier immer "Search Console". Der Loader liest die
# M1-Datei und alle Dateien dieses Ordners. Texte: core/issues/texts/{de,en}.d/search_console.toml (Schlüssel issues.<id>).
# Einträge: M2-I03. Klassifizierung abgeleitet aus öffentlicher Dokumentation der Referenz (Benchmark), begründet nach UI-063.
# „Rich Result Invalid“ ist in docs/plan/M2-filters.toml kein Befund-Filter (ohne issue = true) und fehlt daher hier.

schema = 1

[[issue]]
id = "search-console-page-is-not-mobile-friendly"
tab = "Search Console"
filter = "Page Is Not Mobile Friendly"
type = "Issue"
priority = "High"
type_rule = "T-I3"
priority_rule = "P-H3"
needs_crawl_analysis = false
doc_key = "search-console-page-is-not-mobile-friendly"

