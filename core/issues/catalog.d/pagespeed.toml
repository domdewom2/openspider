# OpenSpider – Issue-Katalog ab M2, Tab „PageSpeed“ (UI-063/UI-064).
#
# Einträge wie in core/issues/catalog.toml (`[[issue]]` mit id, tab, filter, type, priority, type_rule, priority_rule,
# doc_key, optional override_reason/needs_crawl_analysis/text_params); `tab` ist hier immer "PageSpeed". Der Loader liest die
# M1-Datei und alle Dateien dieses Ordners. Texte: core/issues/texts/{de,en}.d/pagespeed.toml (Schlüssel issues.<id>).
# Klassifizierung abgeleitet aus öffentlicher Dokumentation der Referenz (Benchmark), begründet nach UI-063.
# Herleitung (M2-I04): durchgehend T-O2 (messbare Einsparung, nichts ist kaputt). Priorität nach Einsparpotenzial:
# Befunde mit Wirkung auf die Ladezeit-Kennzahlen (Core Web Vitals) und damit auf die Bewertung im Suchergebnis
# P-M1; Optimize DOM Size und Font Display wirken nur unter Sonderbedingungen bzw. als Hygiene P-L1.

schema = 1

