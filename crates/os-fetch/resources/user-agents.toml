# User-Agent-Voreinstellungen (CRAWL-114).
#
# Die Datei wird zur Übersetzungszeit eingebettet, kann aber zur Laufzeit ohne Code-Änderung durch eine
# eigene Datei gleichen Aufbaus ersetzt werden (os_fetch::user_agents::parse_presets).
#
# Je Eintrag:
#   id            stabile Kennung (steht in `user_agent.preset` der .osconfig)
#   name          Anzeigename
#   group         Gruppe in der Auswahlliste
#   user_agent    HTTP-User-Agent; "{version}" wird durch die OpenSpider-Version ersetzt.
#                 Fehlt der Eintrag, ist die Voreinstellung „nur Token“ (z. B. Google-Extended).
#   robots_token  Token, unter dem robots.txt-Gruppen und agentenspezifische Meta-Robots ausgewertet
#                 werden; "*" = kein eigenes Token (Browser).
#
# Browser-Voreinstellungen tragen die Hauptversion 138 (Stand der Datei).

[[preset]]
id = "openspider"
name = "OpenSpider"
group = "OpenSpider"
user_agent = "Mozilla/5.0 (compatible; OpenSpider/{version}; +https://openspider.de)"
robots_token = "OpenSpider"

[[preset]]
id = "googlebot-smartphone"
name = "Googlebot Smartphone"
group = "Suchmaschinen"
user_agent = "Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
robots_token = "Googlebot"

