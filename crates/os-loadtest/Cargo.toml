[package]
name = "os-loadtest"
default-run = "os-loadtest"
description = "OpenSpider: Lasttest-Runner (PERF-009) gegen synthetische os-testsite-Sites"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
os-model.workspace = true
os-fetch.workspace = true
os-store.workspace = true
os-engine.workspace = true
os-testsite.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
tracing.workspace = true

# Spitzen-RSS des Kernprozesses (PERF-001, P28)
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[[bin]]
name = "os-loadtest"
path = "src/main.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "gen-ui-large"
path = "src/bin/gen-ui-large.rs"
