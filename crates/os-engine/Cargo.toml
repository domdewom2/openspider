[package]
name = "os-engine"
description = "OpenSpider: Frontier, Scheduler, Worker-Pool, Crawl-Modi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
os-model.workspace = true
os-url.workspace = true
os-fetch.workspace = true
os-parse.workspace = true
os-store.workspace = true
# M2-F02 (3.2): Rendering-Hook und API-Abruf hinter Traits; os-engine kennt os-analyze weiterhin nicht
os-render.workspace = true
os-integrations.workspace = true
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
bytes.workspace = true
futures-util.workspace = true
time.workspace = true
flate2.workspace = true
calamine.workspace = true
csv.workspace = true
# nur Feature `testing` (Testhelfer crate::testing); os-engine hängt nie an os-analyze (M1-Plan 3.2)
os-testsite = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[features]
testing = ["dep:os-testsite", "dep:tempfile"]

[dev-dependencies]
# Selbst-Abhängigkeit: `cargo test -p os-engine` schaltet das Feature `testing` für die eigenen Tests ein
os-engine = { workspace = true, features = ["testing"] }
os-testsite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
