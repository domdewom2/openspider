[package]
name = "os-app"
description = "OpenSpider: Tauri-freie Service-Schicht der Desktop-App (Sitzung, View-Register, DTOs, Command-Dispatcher)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Bridge-Protokoll für E2E-A (M2-F03): WebSocket auf Loopback mit Token
e2e-bridge = ["dep:tokio-tungstenite"]
# Synthetische 5-Mio.-View für den Grid-Gate-Spike S-1 (M2-S01)
stub-views = []

[dependencies]
# M2-X03 review: temporary staging for export.sheets (OUT-005).
tempfile.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true
sysinfo.workspace = true

os-model.workspace = true
os-url.workspace = true
os-fetch.workspace = true
os-parse.workspace = true
os-store.workspace = true
os-analyze.workspace = true
os-engine.workspace = true
os-export.workspace = true
os-mcp.workspace = true
os-integrations.workspace = true
os-render.workspace = true
os-sched.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
futures-util.workspace = true
time.workspace = true
uuid.workspace = true
dirs.workspace = true
# M2-F01 (3.1/3.2): DTO-Ausgabe, Segment-/Vergleichsfilter, Quelltext-Diff, Authentifizierungsprofile
ts-rs.workspace = true
roaring.workspace = true
similar.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
os-engine = { workspace = true, features = ["testing"] }
os-testsite.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
# Schreibt apps/desktop/src/ipc/commands.json (und mit --ts-dir die DTO-Typen) aus der Registry
name = "os-app-manifest"
path = "src/bin/os-app-manifest.rs"

[[bin]]
name = "os-app-bridge"
path = "src/bin/os-app-bridge.rs"
required-features = ["e2e-bridge"]

[[bench]]
name = "views"
harness = false
